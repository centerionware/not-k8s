[workspace]
resolver = "2"
members = ["crates/nodelet"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["not-k8s contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
kube = { version = "4.0", default-features = false, features = ["client", "config", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["v1_33"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# CRI (real container runtime) deps — only pulled in with --features cri
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "channel"] }
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", features = ["ring"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimized like release, but keeps DWARF symbols for Linux perf/FlameGraph
# captures. The normal release profile stays stripped for deployment.
[profile.profiling]
inherits = "release"
debug = 2
strip = false
