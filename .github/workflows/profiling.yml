name: Profiling — comparison or full-stack load

# Manual trigger only, same conservative posture as e2e.yml — this job is
# slow and its numbers are only meaningful once things have settled, not
# something to fire on every push.
#
# What this measures and why: idle/steady-state RSS + CPU (%, absolute
# CPU-seconds, and — where the runner's perf_event access allows it, real
# hardware cycles/instructions) for the node agent, sampled every second
# over the whole window so the report can chart what happened over time,
# not just report one final average. nodelet's core pitch is "does the
# same job as kubelet using dramatically less idle overhead," so that's
# the number that matters, not synthetic throughput.
#
# Round 124: rebuilt three times —
#   1. From a nodelet-vs-stock-k3s comparison to a genuine apples-to-apples
#      one. A default k3s install can't isolate "kubelet's own number" at
#      all — k3s runs kubelet as an embedded goroutine inside the same OS
#      process as the apiserver/kine-SQLite/controller-manager/scheduler, so
#      there's no separate process to measure. This job instead runs a
#      REAL, standalone upstream kubelet binary
#      (deploy/lib/upstream-kubelet.sh), version-matched to this cluster's
#      own k3s-embedded Kubernetes release, against the exact same
#      stripped `k3s server --disable-agent` control plane and the exact
#      same containerd nodelet already uses — swapping only the node
#      agent itself, with everything else held constant.
#   2. From one runner measuring both agents *sequentially* to a matrix of
#      independent runners measuring one agent each *in parallel* —
#      sequential measurement risks exactly the kind of bias this report
#      exists to rule out (disk cache state, memory fragmentation, thermal
#      throttling, or anything else accumulated by the first phase
#      quietly advantaging or disadvantaging whichever ran second). Every
#      matrix leg provisions itself via the exact same real standalone
#      installer (`install-scripts` branch's `install.sh`, what a real
#      user actually runs — fetches the latest published release's
#      prebuilt nodelet binary, not a from-source build, so this profiles
#      the actual shipped artifact) — the kubelet legs pass
#      `--skip-nodelet` through to it (bootstrap-source.sh) so nodelet is
#      never built, installed, or started on those runners at all, not
#      just stopped after the fact; `deploy/lib/upstream-kubelet.sh` is
#      the only node agent that ever runs there. Only the profiling/measurement
#      tooling itself (measure.sh, upstream-kubelet.sh,
#      render-profiling-charts.py, profiling-report.sh) runs from this
#      workflow's own checked-out repo rather than whatever copy the
#      installed release happened to bundle — those aren't part of what's
#      being measured.
#   3. From one runner per agent to 3 replicate runners per agent (6 legs
#      total) — a single sample can be noisy (one GC cycle landing inside
#      vs. just outside the window, a slow syscall, a noisy-neighbor VM
#      host, whatever); the report now shows a real mean±range across
#      replicates instead of one point estimate per agent.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Legacy nodelet/kubelet comparison or one full-stack load profile'
        type: choice
        options: [comparison, stack]
        default: comparison
      source_ref:
        description: 'Stack mode: branch, tag, or SHA to build (empty uses this workflow ref)'
        type: string
        default: ''
      build_profile:
        description: 'Stack mode: optimized with symbols, or debug for diagnosis only'
        type: choice
        options: [profiling, debug]
        default: profiling
      archive_limit_mib:
        description: 'Stack mode: maximum compressed bundle size; fail rather than omit data'
        type: string
        default: '512'
      sample_seconds:
        description: "Sample window in seconds, 1 sample/sec (e.g. 120 for 2m, 300 for 5m, 600 for 10m)"
        required: false
        default: "120"
        type: string

permissions:
  contents: write

env:
  # 1 sample/sec. Default 120s comfortably covers nodelet's own
  # node-status-push interval and at least a couple of GC/informer-resync
  # cycles; longer windows (5m/10m via the sample_seconds input above)
  # trade CI time for confidence against rarer periodic activity. The
  # `profile` job's own timeout-minutes has margin for a 600s (10m)
  # window plus bootstrap+settle overhead -- widen that too if pushing
  # sample_seconds past 10m.
  SAMPLE_SECS: ${{ inputs.sample_seconds }}

jobs:
  stack:
    if: inputs.mode == 'stack'
    uses: ./.github/workflows/profile-stack.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
      build_profile: ${{ inputs.build_profile }}
      sample_seconds: ${{ inputs.sample_seconds }}
      archive_limit_mib: ${{ inputs.archive_limit_mib }}
    secrets: inherit

  profile:
    if: inputs.mode != 'stack'
    strategy:
      fail-fast: false
      matrix:
        agent: [nodelet, kubelet]
        replicate: [1, 2, 3]
        include:
          - agent: nodelet
            agent_pattern: nodelet
            # Control plane + containerd/CNI + nodelet itself, and
            # deliberately NO service proxy (--proxy=none).
            #
            # This became a real methodology question when Service routing
            # was split out of nodelet into the separate `nodeproxy`
            # binary. Before the split that work lived inside the nodelet
            # process, so its cost was inside nodelet's measured number.
            # After it, measure.sh (which follows exactly one node-agent
            # PID) would silently stop counting it — nodelet's published
            # figure would drop for a packaging change, not an efficiency
            # one, which is exactly the kind of flattering-but-false
            # number this repo's docs go out of their way not to print.
            #
            # --proxy=none makes both legs symmetric instead: one node
            # agent process per leg, no service proxy on either. The
            # kubelet leg has never run a kube-proxy either (it's a bare
            # upstream-kubelet.sh install), so this is the apples-to-
            # apples comparison, not a dodge. A full node-side comparison
            # — nodelet+nodeproxy vs kubelet+kube-proxy — is a different,
            # also-worth-doing measurement that would need a real
            # kube-proxy on the other side and a measure.sh that sums
            # multiple PIDs. Neither exists today; don't read these
            # numbers as covering service routing on either side.
            skip_nodelet: false
          - agent: kubelet
            agent_pattern: /usr/local/bin/kubelet
            # Round 124 (found live from a user's own review of the run):
            # nodelet should never touch this runner at all, not just get
            # installed-then-stopped -- --skip-nodelet (bootstrap-source.sh)
            # gives the same control plane + containerd + CNI stack with
            # nodelet never built, installed, or started, so
            # upstream-kubelet.sh is the only node agent this runner ever
            # runs.
            skip_nodelet: true
    runs-on: ubuntu-latest
    # 30s settle + up to a 600s (10m) sample_seconds window + bootstrap
    # overhead (~2-3m) comfortably fits inside 30m; widen this if
    # sample_seconds is ever pushed past 10m.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Build the Rust bootstrap applet
        run: cargo build --features cri -p notk8s

      - name: Bootstrap the shared stack with Rust (stripped control plane + containerd${{ matrix.agent == 'nodelet' && ' + nodelet' || '' }})
        env:
          SKIP_NODELET: ${{ matrix.skip_nodelet }}
        run: |
          set -euo pipefail
          args=(bootstrap --proxy=none)
          [[ "$SKIP_NODELET" == true ]] && args+=(--skip-nodelet)
          sudo -E ./target/debug/notk8s "${args[@]}"

      - name: Start a real upstream kubelet (same control plane, same containerd — nodelet was never installed on this runner)
        if: matrix.agent == 'kubelet'
        run: |
          set -e
          sudo bash deploy/lib/upstream-kubelet.sh start

      - name: Settle before measuring idle steady-state
        run: sleep 30

      - name: Measure ${{ matrix.agent }} replicate ${{ matrix.replicate }} (idle, ${{ env.SAMPLE_SECS }}s, 1 sample/sec)
        run: |
          set -e
          sudo ./deploy/measure.sh "$SAMPLE_SECS" /tmp/measure-out "${{ matrix.agent_pattern }}" | tee /tmp/measure-out-console.txt

      - name: Tear down
        if: always()
        run: |
          sudo bash deploy/lib/upstream-kubelet.sh stop 2>/dev/null || true
          sudo systemctl stop nodelet.service 2>/dev/null || true
          sudo systemctl stop k3s.service 2>/dev/null || true
          sudo /usr/local/bin/k3s-uninstall.sh 2>/dev/null || true

      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-${{ matrix.agent }}-${{ matrix.replicate }}
          path: /tmp/measure-out
          retention-days: 1

  report:
    needs: profile
    if: ${{ always() && inputs.mode != 'stack' }}
    concurrency:
      group: profiling-results-publisher
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all measurements
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Install matplotlib/numpy
        run: python3 -m pip install --quiet --break-system-packages matplotlib numpy

      - name: Render charts + aggregated stats
        run: |
          set -e
          mkdir -p /tmp/profiling-report
          nodelet_csvs="/tmp/artifacts/profile-nodelet-1/nodelet-timeseries.csv,/tmp/artifacts/profile-nodelet-2/nodelet-timeseries.csv,/tmp/artifacts/profile-nodelet-3/nodelet-timeseries.csv"
          kubelet_csvs="/tmp/artifacts/profile-kubelet-1/nodelet-timeseries.csv,/tmp/artifacts/profile-kubelet-2/nodelet-timeseries.csv,/tmp/artifacts/profile-kubelet-3/nodelet-timeseries.csv"
          nodelet_summaries="/tmp/artifacts/profile-nodelet-1/summary.txt,/tmp/artifacts/profile-nodelet-2/summary.txt,/tmp/artifacts/profile-nodelet-3/summary.txt"
          kubelet_summaries="/tmp/artifacts/profile-kubelet-1/summary.txt,/tmp/artifacts/profile-kubelet-2/summary.txt,/tmp/artifacts/profile-kubelet-3/summary.txt"
          python3 deploy/lib/render-profiling-charts.py /tmp/profiling-report \
            --series "nodelet=$nodelet_csvs" \
            --series "upstream kubelet=$kubelet_csvs" \
            --summary "nodelet=$nodelet_summaries" \
            --summary "upstream kubelet=$kubelet_summaries"

      - name: Build comparison report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          bash deploy/lib/profiling-report.sh \
            /tmp/profiling-report/stats.md \
            "$COMMIT_SHA" "$RUN_URL" \
            > /tmp/profiling-report/README.md
          cat /tmp/profiling-report/README.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results to the profiling-results branch
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Round 124 (found live in CI): a *separate* `git clone` into a
          # fresh WORKDIR doesn't inherit whatever credential setup
          # actions/checkout@v7 did for the already-checked-out repo --
          # that clone had no way to authenticate the later `git push` at
          # all ("could not read Username for 'https://github.com'").
          # Embedding the real token in the clone/push URL itself is what
          # actually carries auth into that separate clone.
          AUTH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -e
          git config --global user.name "not-k8s-profiling-bot"
          git config --global user.email "actions@users.noreply.github.com"

          WORKDIR="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$AUTH_URL" profiling-results >/dev/null 2>&1; then
            git clone --branch profiling-results --single-branch "$AUTH_URL" "$WORKDIR"
          else
            git clone "$AUTH_URL" "$WORKDIR"
            (cd "$WORKDIR" && git checkout --orphan profiling-results && git rm -rf . >/dev/null 2>&1 || true)
          fi

          # Round 124: plain date-first timestamp, not <sha>-<timestamp> --
          # the commit is already in the README's own "Commit `...`" line
          # and in each git log entry; cluttering the directory name with
          # it too just made every entry harder to scan at a glance.
          STAMP="$(date -u +%Y-%m-%d_%H-%M-%S)"
          SHORT_SHA="${COMMIT_SHA:0:12}"
          RUN_DIR="$WORKDIR/history/${STAMP}"
          # raw-data/ keeps every CSV/summary.txt this run produced, separate
          # from the main README.md + charts — anyone who wants to build
          # their own charts/analysis from the real numbers can just take
          # this whole subdirectory without touching the rendered report.
          mkdir -p "$RUN_DIR/raw-data"

          cp /tmp/profiling-report/README.md "$RUN_DIR/README.md" 2>/dev/null || true
          cp /tmp/profiling-report/rss-over-time.png "$RUN_DIR/" 2>/dev/null || true
          cp /tmp/profiling-report/cpu-over-time.png "$RUN_DIR/" 2>/dev/null || true
          for agent in nodelet kubelet; do
            for r in 1 2 3; do
              cp "/tmp/artifacts/profile-${agent}-${r}/nodelet-timeseries.csv" "$RUN_DIR/raw-data/${agent}-${r}-timeseries.csv" 2>/dev/null || true
              cp "/tmp/artifacts/profile-${agent}-${r}/k3s-timeseries.csv" "$RUN_DIR/raw-data/${agent}-${r}-k3s-server-timeseries.csv" 2>/dev/null || true
              cp "/tmp/artifacts/profile-${agent}-${r}/summary.txt" "$RUN_DIR/raw-data/${agent}-${r}-summary.txt" 2>/dev/null || true
            done
          done

          # "latest" always mirrors this run's files at a stable path — the
          # branch's own top-level README.md links here.
          rm -rf "$WORKDIR/latest"
          cp -r "$RUN_DIR" "$WORKDIR/latest"

          bash deploy/lib/profiling-report.sh --readme \
            "$COMMIT_SHA" "$RUN_URL" "$STAMP" \
            > "$WORKDIR/README.md"
          [[ ! -f "$WORKDIR/latest-stack.md" ]] || printf '\n[Latest stack profile](latest-stack.md)\n' >> "$WORKDIR/README.md"

          cd "$WORKDIR"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "profiling results for ${COMMIT_SHA}"
            git push origin profiling-results
          fi
