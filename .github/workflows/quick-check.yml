name: Quick check (x86_64, no artifacts)

# The fast iteration loop: native x86_64, debug profile, no musl/cross
# targets, no artifact upload — just "does this compile and pass its own
# tests," in the shortest round trip this repo has. build.yml is
# deliberately heavier (static musl binaries for three architectures,
# uploaded as run artifacts) because it doubles as "give me a binary to
# try on a device"; most iteration on a branch needs none of that.
#
# This does NOT replace a gate on the merge path — CLAUDE.md's merge
# protocol (build.yml + e2e.yml, full unfiltered suite) still applies
# before anything merges to main. Use this for the same kind of tight
# edit/dispatch/read-result loop e2e.yml's `only` input gives targeted
# e2e iteration, just for compile+unit-test correctness instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain

      - name: cargo test (native x86_64, debug)
        # No separate `cargo build` step — `cargo test` already compiles
        # the lib, bins, and test targets for each package before running
        # anything, so a prior build step would just pay the same
        # compilation twice for no extra signal.
        #
        # Under sudo for the same reason build.yml's test job is:
        # nodeproxy's svc.rs nft_check() tests open real netlink/nftables
        # sockets to validate generated ruleset syntax, which needs
        # CAP_NET_ADMIN. sudo -E preserves PATH/CARGO_HOME/RUSTUP_HOME that
        # setup-toolchain put in $GITHUB_ENV/$GITHUB_PATH.
        run: |
          set -e
          sudo -E env "PATH=$PATH" cargo test -p nodelet
          sudo -E env "PATH=$PATH" cargo test -p nodelet --features cri
          for crate in nodeproxy nodestore nodescheduler nodecontroller node-leaderelection nodeapiserver notk8s; do
            if [[ -d "crates/$crate" ]]; then
              sudo -E env "PATH=$PATH" cargo test -p "$crate"
            else
              echo "crates/$crate not present on this ref — skipping its tests."
            fi
          done
