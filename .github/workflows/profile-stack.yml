name: Stack load profile

# Reused by the manual profiling selector and by the release workflow. All
# build, bootstrap, capture, rendering and publication stays on ONE runner.
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      build_profile:
        type: string
        default: profiling
      sample_seconds:
        type: string
        default: '120'
      archive_limit_mib:
        type: string
        default: '512'

permissions:
  contents: write

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: profiling-results-publisher
      cancel-in-progress: false
    env:
      PROFILE_BUILD: ${{ inputs.build_profile }}
      PROFILE_SECONDS: ${{ inputs.sample_seconds }}
      PROFILE_ARCHIVE_LIMIT_MIB: ${{ inputs.archive_limit_mib }}
      KUBECONFIG: /etc/nodebootstrap/admin.kubeconfig
      FLAMEGRAPH_DIR: ${{ github.workspace }}/.bootstrap/flamegraph-tools
      RUSTFLAGS: '-C force-frame-pointers=yes'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the exact source to profile
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          path: profile-source
          persist-credentials: false
      - name: Validate inputs and record source identity
        run: |
          set -euo pipefail
          case "$PROFILE_BUILD" in profiling|debug) ;; *) exit 2 ;; esac
          [[ "$PROFILE_SECONDS" =~ ^[0-9]+$ ]] && (( PROFILE_SECONDS >= 30 && PROFILE_SECONDS <= 600 ))
          [[ "$PROFILE_ARCHIVE_LIMIT_MIB" =~ ^[0-9]+$ ]] && (( PROFILE_ARCHIVE_LIMIT_MIB >= 64 && PROFILE_ARCHIVE_LIMIT_MIB <= 2048 ))
          mkdir -p profile-data/bootstrap
          sha=$(git -C profile-source rev-parse HEAD)
          echo "PROFILE_SHA=$sha" >> "$GITHUB_ENV"
          {
            echo "source_sha=$sha"
            echo "tooling_sha=$(git rev-parse HEAD)"
            echo "build_profile=$PROFILE_BUILD"
            echo "seconds_per_phase=$PROFILE_SECONDS"
            echo "rustflags=$RUSTFLAGS"
            echo 'sampling=cpu-clock,49Hz,frame-pointers'
            uname -a
            lscpu
            free -h
          } > profile-data/metadata.txt
      - uses: ./.github/actions/setup-toolchain
      - name: Install and verify profiling tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-generic perl
          python3 -m pip install --quiet --break-system-packages matplotlib numpy
          # Ubuntu's versioned kernel directory contains symlinks to the real tool.
          perf_bin=$(find -L /usr/lib/linux-tools -type f -name perf | sort -V | tail -1)
          [[ -n "$perf_bin" && -x "$perf_bin" ]] || { echo 'No usable perf executable installed' >&2; exit 1; }
          echo "$(dirname "$perf_bin")" >> "$GITHUB_PATH"
          sudo sysctl kernel.perf_event_paranoid=-1
          sudo "$perf_bin" stat -e cpu-clock -- sleep 1
          mkdir -p "$FLAMEGRAPH_DIR"
          for tool in stackcollapse-perf.pl flamegraph.pl; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/brendangregg/FlameGraph/41fee1f99f9276008b7cd112fca19dc3ea84ac32/$tool" -o "$FLAMEGRAPH_DIR/$tool"
          done
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl -o /tmp/profile-kubectl
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256 -o /tmp/profile-kubectl.sha256
          echo "$(cat /tmp/profile-kubectl.sha256)  /tmp/profile-kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/profile-kubectl /usr/local/bin/kubectl
      - name: Build symbolized combined runtime locally on the runner
        id: build
        working-directory: profile-source
        run: |
          set -euo pipefail
          if [[ "$PROFILE_BUILD" == debug ]]; then
            cargo build --features cri -p notk8s
          else
            cargo build --profile profiling --features cri -p notk8s
          fi
          binary="$GITHUB_WORKSPACE/profile-source/target/$PROFILE_BUILD/notk8s"
          # Older integration refs can have a stale lockfile (the normal e2e
          # build also resolves it). Retain the exact resolved graph and diff.
          cp Cargo.lock "$GITHUB_WORKSPACE/profile-data/Cargo.lock"
          git diff -- Cargo.lock > "$GITHUB_WORKSPACE/profile-data/lockfile-resolution.patch"
          echo "PROFILE_BINARY=$binary" >> "$GITHUB_ENV"
          {
            rustc -Vv
            cargo -V
            perf --version
            sha256sum "$binary" Cargo.lock
            "$binary" components
          } >> "$GITHUB_WORKSPACE/profile-data/metadata.txt"
      - name: Profile bootstrap and verify the cluster
        id: bootstrap
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" NOTK8S_COMBINED_PREBUILT="$PROFILE_BINARY" NOTK8S_BUILD_LAYOUT=combined \
            perf record -e cpu-clock -F 49 --call-graph fp -o "$GITHUB_WORKSPACE/profile-data/bootstrap/perf.data" -- \
            "$PROFILE_BINARY" nodebootstrap --layout=combined --apiserver=nodeapiserver --datastore=nodestore --scheduler=nodescheduler --controller-manager=nodecontroller --proxy=nodeproxy
          sudo chmod 644 "$KUBECONFIG"
          kubectl wait nodes --all --for=condition=Ready --timeout=180s
          kubectl version -o json > profile-data/kubernetes-version.json
          kubectl get nodes -o json > profile-data/nodes.json
          kubectl -n kube-system get pods -o json > profile-data/system-pods.json
      - name: Capture idle and realistic bounded load
        id: capture
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" python3 deploy/profile-stack.py --seconds "$PROFILE_SECONDS" --output "$GITHUB_WORKSPACE/profile-data"
      - name: Preserve diagnostics and render after captures stop
        id: render
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          # Preserve both executable locations used in perf mmap records.
          first_copy=''
          for binary in "$PROFILE_BINARY" /var/lib/nodebootstrap/toolchain/bin/notk8s; do
            [[ -f "$binary" ]] || continue
            dest="$GITHUB_WORKSPACE/profile-data/symfs$binary"
            mkdir -p "$(dirname "$dest")"
            if [[ -n "$first_copy" ]] && cmp -s "$first_copy" "$binary"; then
              ln "$first_copy" "$dest"
            else
              cp "$binary" "$dest"
              first_copy="$dest"
            fi
          done
          for component in nodelet nodeproxy nodeapiserver nodestore nodecontroller nodescheduler; do
            sudo journalctl -u "$component" --no-pager -n 500 > "profile-data/$component-journal.txt"
          done
          sudo chown -R "$(id -u):$(id -g)" profile-data
          while IFS= read -r -d '' data; do
            dir=$(dirname "$data")
            bash deploy/lib/render-perf.sh "$dir" "${dir#profile-data/}"
          done < <(find profile-data -name perf.data -print0)
          if [[ '${{ steps.capture.outcome }}' == success ]]; then
            python3 deploy/lib/render-stack-charts.py --output profile-data/charts --series not-k8s=profile-data
          fi
      - name: Publish full compressed results without Actions artifacts
        if: ${{ always() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_RESULT: capture=${{ steps.capture.outcome }},render=${{ steps.render.outcome }}
        run: bash deploy/publish-stack-profile.sh "$GITHUB_WORKSPACE/profile-data"
      - name: Stop disposable cluster services
        if: always()
        run: sudo systemctl stop nodelet nodeproxy nodecontroller nodescheduler nodeapiserver nodestore flanneld containerd || true
