name: Bootstrap e2e

# Manual real-infrastructure validation for the Rust bootstrap applet. The
# Rust runner keeps the former five-way CI shape: CSI/DRA tests are assigned
# across shards 1-2, while all other tests are assigned across shards 1-5.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional test-name substring or comma-separated substrings'
        required: false
        default: ''
      proxy:
        description: 'Install nodeproxy or omit it for an apiserver-only check'
        required: false
        default: nodeproxy
        type: choice
        options: [nodeproxy, none]
      apiserver:
        description: 'Select the upstream or repository API server target'
        required: false
        default: nodeapiserver
        type: choice
        options: [upstream, nodeapiserver]
      network:
        description: 'Use flannel or exercise the external-CNI bootstrap path'
        required: false
        default: flannel
        type: choice
        options: [flannel, external]
      cluster_domain:
        description: 'Cluster DNS domain passed to the bootstrapper'
        required: false
        default: cluster.local
        type: string
      cidr:
        description: 'Optional IPv4 service CIDR passed to the bootstrapper'
        required: false
        default: ''
        type: string
      cidr6:
        description: 'Optional IPv6 service CIDR passed to the bootstrapper'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare-e2e-results:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare results
        env:
          RESULTS_BRANCH: e2e-results
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          payload=$(mktemp -d)
          cat > "$payload/README.md" <<EOF
          # e2e results

          - commit: $GITHUB_SHA
          - workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - started (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Each shard writes its complete output to results-shard-N.txt.
          EOF
          bash deploy/publish-validation-results.sh "$payload" "$RESULTS_BRANCH" \
            "history/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '# E2E results\n\n[Browse runs and attempts](history/). Each run retains its own shard logs.\n' \
            > "$payload/README.md"
          bash deploy/publish-validation-results.sh "$payload" "$RESULTS_BRANCH"

  build-source-runtime:
    needs: prepare-e2e-results
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build bootstrap
        run: cargo build -p nodebootstrap

      - name: Prepare musl
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools musl-dev linux-libc-dev

      - name: Build runtime
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/e2e-source-stage"
          rm -rf "$stage" e2e-bin
          mkdir -p e2e-bin
          NODEBOOTSTRAP_ARCH=x86_64 \
          NODEBOOTSTRAP_REPO_ROOT="$GITHUB_WORKSPACE" \
          NODEBOOTSTRAP_TOOLCHAIN_DIR="$stage" \
          NODEBOOTSTRAP_SOURCE=compile \
          NOTK8S_BUILD_LAYOUT=combined \
          NOTK8S_BUILD_PROFILE=release \
            ./target/debug/nodebootstrap fetch
          install -m0755 "$stage/bin/notk8s" e2e-bin/notk8s
          # The installer is already an applet. Upload one release binary,
          # not a second copy dereferenced from its nodebootstrap symlink.
          e2e-bin/notk8s components | grep -Fx nodebootstrap

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodebootstrap-e2e-source-${{ github.run_id }}
          path: e2e-bin/
          # GitHub's minimum is one day; cleanup-e2e-artifact removes this
          # run-scoped artifact as soon as every shard has consumed it.
          retention-days: 1

  plan-e2e:
    needs: build-source-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nodebootstrap-e2e-source-${{ github.run_id }}
          path: dist-bin

      - name: Plan e2e shards
        id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          chmod +x dist-bin/notk8s
          ln -s notk8s dist-bin/nodebootstrap
          args=(--e2e-list)
          [[ -z "$ONLY" ]] || args+=("--only=$ONLY")
          matrix='{"include":[]}'
          for shard in 1 2 3 4 5; do
            selected="$(./dist-bin/nodebootstrap "${args[@]}" "--shard=${shard}/5")"
            if [[ -n "$selected" ]]; then
              driver_args=(--e2e-needs-drivers "--shard=${shard}/5")
              [[ -z "$ONLY" ]] || driver_args+=("--only=$ONLY")
              needs_drivers="$(./dist-bin/nodebootstrap "${driver_args[@]}")"
              [[ "$needs_drivers" == true || "$needs_drivers" == false ]] || {
                echo "invalid driver requirement result for shard $shard: $needs_drivers" >&2
                exit 1
              }
              matrix="$(jq -c --argjson shard "$shard" --argjson needs_drivers "$needs_drivers" \
                '.include += [{shard: $shard, needs_drivers: $needs_drivers}]' <<<"$matrix")"
            fi
          done
          echo "$matrix" | tee /tmp/e2e-matrix.json
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [prepare-e2e-results, build-source-runtime, plan-e2e]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-e2e.outputs.matrix).include }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nodebootstrap-e2e-source-${{ github.run_id }}
          path: dist-bin

      - name: Run e2e shard
        uses: ./.github/actions/e2e-run
        with:
          shard: ${{ matrix.shard }}
          needs_drivers: ${{ matrix.needs_drivers }}
          only: ${{ inputs.only }}
          proxy: ${{ inputs.proxy }}
          apiserver: ${{ inputs.apiserver }}
          network: ${{ inputs.network }}
          cluster_domain: ${{ inputs.cluster_domain }}
          cidr: ${{ inputs.cidr }}
          cidr6: ${{ inputs.cidr6 }}
          results_prefix: history/${{ github.run_id }}-${{ github.run_attempt }}

  cleanup-e2e-artifact:
    needs: [build-source-runtime, e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == ("nodebootstrap-e2e-source-" + env.GITHUB_RUN_ID)) | .id' \
            | head -n1)"
          if [[ -n "$artifact_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          fi
