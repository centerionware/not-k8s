name: Bootstrap e2e

# Manual real-infrastructure validation for the Rust bootstrap applet. The
# former shell harness and its shard matrix were removed in the 0.7.1
# cutover; `bootstrap --e2e` is now the only repository-owned e2e entrypoint.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional test-name substring or comma-separated substrings'
        required: false
        default: ''
      proxy:
        description: 'Install nodeproxy or omit it for an apiserver-only check'
        required: false
        default: nodeproxy
        type: choice
        options: [nodeproxy, none]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Build the combined bootstrap applet
        run: cargo build --features cri -p notk8s

      - name: Bootstrap a real cluster with Rust
        env:
          PROXY: ${{ inputs.proxy }}
        run: |
          set -euo pipefail
          sudo -E ./target/debug/notk8s bootstrap \
            --layout=combined \
            --proxy="$PROXY" \
            --datastore=nodestore \
            --scheduler=nodescheduler \
            --controller-manager=nodecontroller

      - name: Make the admin kubeconfig readable
        run: sudo chmod 644 /etc/nodebootstrap/admin.kubeconfig

      - name: Run bootstrap-native e2e checks
        env:
          KUBECONFIG: /etc/nodebootstrap/admin.kubeconfig
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          args=(bootstrap --e2e)
          [[ -z "$ONLY" ]] || args+=("--only=$ONLY")
          ./target/debug/notk8s "${args[@]}"

      - name: Dump bootstrap service state on failure
        if: failure()
        run: |
          sudo systemctl --no-pager --full status kube-apiserver nodestore nodelet nodeproxy nodescheduler nodecontroller flanneld || true
          for unit in kube-apiserver nodestore nodelet nodeproxy nodescheduler nodecontroller flanneld; do
            sudo journalctl -u "$unit" -n 80 --no-pager || true
          done
