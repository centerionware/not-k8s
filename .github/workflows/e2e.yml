name: E2E tests

# Manual, ad-hoc utility — release.yml's own e2e stage is the real gate
# (runs on every push to main, no --only filter, must pass to reach the
# release stages). This workflow is for on-demand debugging: rerun just
# the e2e suite (optionally filtered to one test) without waiting on the
# rest of the pipeline. Builds a full not-k8s cluster from source
# (deploy/bootstrap-source.sh --with-cri: k3s control plane, real
# containerd/runc, nodelet built with the cri feature) on the runner
# itself, installs the same reference CSI + DRA drivers release.yml's e2e
# stage does (deploy/lib/e2e-full-setup.sh) so CSI/DRA-gated tests
# actually run instead of skipping, runs deploy/test-e2e.sh against it,
# and pushes the results to a dedicated branch (creating it if it doesn't
# exist yet, replacing its contents otherwise) regardless of whether the
# run passed.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional --only=<pattern> filter (substring match on test function names; comma-separate multiple patterns to run several specific tests in one dispatch). Leave empty to run everything.'
        required: false
        default: ''
      layout:
        description: 'Which build layout to deploy and test against: split (separate per-component binaries, the default everywhere) or combined (the single multi-call notk8s binary).'
        required: false
        default: split
        type: choice
        options: [split, combined]
      scheduler:
        description: 'Which scheduler places pods: none (k3s bundled kube-scheduler, the shipped default) or nodescheduler (ours, which also passes --disable-scheduler to k3s). Only cases/scheduler.sh needs ours, and it self-skips without it. Leave as none for a full-suite run — see the comment on the deploy step.'
        required: false
        default: none
        type: choice
        options: [none, nodescheduler]
      debug_scheduler_log:
        description: 'Set RUST_LOG=nodescheduler=debug on the deployed nodescheduler service, for chasing a live flake whose only lead is a reason string with no numbers behind it (node_resources_fit.rs is the case this exists for). Off by default — this is chattier than the normal info level and only useful when actively diagnosing something.'
        required: false
        default: false
        type: boolean
      controller_manager:
        description: 'Which controller manager runs the suite: none (k3s bundled kube-controller-manager, the shipped default) or nodecontroller (ours, which also passes --disable-controller-manager to k3s). nodecontroller implements the controller domains documented in docs/CONTROLLER_MANAGER.md, including node lifecycle/PodCIDR, workload controllers, garbage collection, ServiceAccounts, quotas, and storage helpers; use it to exercise those implementations, while cases outside that scope should self-skip.'
        required: false
        default: none
        type: choice
        options: [none, nodecontroller]
      proxy:
        description: 'Whether to install nodeproxy (the default Service/ClusterIP routing path) or run the controller-manager test without it. The none option is for isolating apiserver/watch failures from nftables churn.'
        required: false
        default: nodeproxy
        type: choice
        options: [nodeproxy, none]
      datastore:
        description: 'Which control-plane datastore to use: nodestore (the default stronger path) or none (k3s bundled kine, useful for isolating controller/API behavior from nodestore).'
        required: false
        default: nodestore
        type: choice
        options: [nodestore, none]

permissions:
  contents: write

jobs:
  # Plan the shard matrix without touching a cluster. Registration and
  # filtering are pure shell, so an --only dispatch that lands on only one or
  # two shards no longer spends the other runners' time bootstrapping and
  # compiling a cluster just to run zero tests.
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.plan.outputs.has_tests }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select non-empty shards
        id: plan
        env:
          ONLY_PATTERN: ${{ inputs.only || '' }}
        run: |
          set -euo pipefail
          entries=()
          for shard in 1 2 3 4 5; do
            args=(--list --shard="$shard/5")
            [[ -z "$ONLY_PATTERN" ]] || args+=(--only="$ONLY_PATTERN")
            selected="$(./deploy/test-e2e.sh "${args[@]}")"
            count="$(printf '%s\n' "$selected" | sed -n 's/^selected_tests=//p')"
            [[ "$count" =~ ^[0-9]+$ ]] || {
              echo "planner did not return a selected_tests count for shard $shard" >&2
              exit 1
            }
            if (( count > 0 )); then
              needs_drivers=false
              (( shard <= 2 )) && needs_drivers=true
              entries+=("{\"shard\":$shard,\"needs_drivers\":$needs_drivers}")
            fi
          done

          if ((${#entries[@]} == 0)); then
            # Keep the JSON valid even when the e2e job is skipped by its
            # job-level condition below. No runner is allocated in this case.
            echo 'has_tests=false' >> "$GITHUB_OUTPUT"
            echo 'shards=[{"shard":1,"needs_drivers":false}]' >> "$GITHUB_OUTPUT"
          else
            shards_json="$(IFS=,; printf '[%s]' "${entries[*]}")"
            echo 'has_tests=true' >> "$GITHUB_OUTPUT"
            echo "shards=$shards_json" >> "$GITHUB_OUTPUT"
          fi

  # Sharded 5 ways, exactly like release.yml's own e2e stage — same
  # test-e2e.sh --shard=N/M and harness.sh _filter_shard() machinery, same
  # needs_drivers split, and needs_drivers MUST keep matching harness.sh's
  # NUM_DRIVER_SHARDS (they are not wired together).
  #
  # Not a speed optimisation: unsharded, this workflow could not finish an
  # unfiltered run at all. Confirmed live — a full suite here ran for
  # exactly 90 minutes and was killed by the cap, reporting "cancelled",
  # which looks identical to someone having pressed cancel and says nothing
  # about whether anything passed. That made the documented "run the full
  # suite on your branch before merging" step impossible to actually
  # perform, so every unfiltered dispatch was a 90-minute way of learning
  # nothing.
  #
  # --only dispatches now allocate only the shards whose filtered test list
  # is non-empty; a filter that matches one test no longer creates four
  # unrelated clusters just to report four empty summaries.
  e2e:
    needs: plan
    if: needs.plan.outputs.has_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and deploy not-k8s (real containerd/CRI runtime)
        # Debug profile: this stage only needs a correct binary, not an
        # optimized one — see release.yml's own e2e job for why.
        #
        # The `layout` input is how the combined single-binary layout gets
        # a real end-to-end run: deployed that way, bin/nodelet and
        # bin/nodeproxy are symlinks into one multi-call binary, and the
        # entire suite below becomes a test of whether that is genuinely
        # indistinguishable from the split layout it was written against.
        # release.yml's own e2e stage stays on split — the default is what
        # gates a release; this is the on-demand check of the other one.
        #
        # DATASTORE=nodestore does more than build the binary, and this
        # comment used to claim otherwise: bootstrap-source.sh installs
        # nodestore as a service and points k3s at it with
        # --datastore-endpoint, so the whole suite below runs against a
        # control plane whose storage is nodestore rather than k3s's bundled
        # kine. That is deliberate and is the stronger coverage — every test
        # here becomes an assertion that a real apiserver works on it — but it
        # does mean a failure anywhere in this suite can be a datastore
        # failure, not only a nodelet one.
        #
        # datastore.sh and datastore_apiserver.sh are unaffected either way:
        # they run their own throwaway instances on scratch paths and ports
        # rather than touching the cluster's own storage.
        #
        # Set DATASTORE=none to run this suite against bundled kine instead,
        # which is what isolates a nodelet regression from a datastore one.
        #
        # SCHEDULER is deliberately NOT defaulted on, unlike DATASTORE above,
        # and the difference is feature completeness rather than confidence.
        #
        # nodestore implements the whole etcd v3 surface the apiserver uses,
        # so turning it on makes every test in this suite an additional
        # assertion about it — strictly more coverage. nodescheduler is
        # phase 1 (docs/SCHEDULER.md): no VolumeBinding, no DynamicResources,
        # no PodTopologySpread, no InterPodAffinity, no preemption. Turning it
        # on for the *full* suite therefore makes a phase-1 component the gate
        # for phase-4 and phase-5 tests, which cannot pass and are not
        # supposed to:
        #
        #   * a WaitForFirstConsumer PVC is never provisioned, because the
        #     VolumeBinding plugin is what writes
        #     volume.kubernetes.io/selected-node at PreBind;
        #   * a ResourceClaim is never allocated, because the DynamicResources
        #     plugin is what writes status.allocation and reservedFor before
        #     the Binding (see docs/GAP_CLOSURE.md — that is the scheduler's
        #     job, not kubelet's);
        #   * anti-affinity and spread constraints are simply not evaluated,
        #     so pods that ought to be rejected get placed.
        #
        # So: run the full suite against the shipped default, and dispatch
        # scheduler coverage explicitly —
        #
        #   gh workflow run e2e.yml -f scheduler=nodescheduler -f only=scheduler
        #
        # Flip the default here once phases 4 and 5 land, at which point the
        # "every pod-creating test also asserts our placement" property
        # genuinely holds.
        env:
          NOTK8S_BUILD_PROFILE: debug
          NOTK8S_BUILD_LAYOUT: ${{ inputs.layout || 'split' }}
          DATASTORE: ${{ inputs.datastore || 'nodestore' }}
          SCHEDULER: ${{ inputs.scheduler || 'none' }}
          # Same two-halves-of-one-switch pairing as SCHEDULER, same
          # "leave off for a full-suite run" reasoning — see this input's
          # own description above.
          CONTROLLER_MANAGER: ${{ inputs.controller_manager || 'none' }}
          # Picked up by nodescheduler-service.sh's env forwarding — only
          # written into the installed unit when non-empty, so leaving
          # debug_scheduler_log off reproduces exactly today's behaviour
          # (run-nodescheduler.sh's own RUST_LOG=info default applies).
          RUST_LOG: ${{ inputs.debug_scheduler_log && 'nodescheduler=debug' || '' }}
        run: sudo -E ./deploy/bootstrap-source.sh --with-cri --proxy=${{ inputs.proxy || 'nodeproxy' }}

      - name: Install misc e2e prerequisites (hugepages, grpcurl)
        # Round 124: split out of e2e-full-setup.sh — these aren't
        # CSI/DRA-gated at all (see e2e-misc-prereqs.sh's own header).
        run: sudo -E bash deploy/lib/e2e-misc-prereqs.sh

      - name: Make the kubeconfig readable
        # Every shard needs this, including the ones that skip the driver
        # install below — same split release.yml already makes.
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: sudo chmod 644 "$KUBECONFIG"

      - name: Install reference CSI + DRA drivers
        if: matrix.needs_drivers
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          # See release.yml's own e2e job for why this has an external
          # ceiling well below the drivers' own internal ~5min timeout.
          sudo -E timeout 180 bash deploy/lib/e2e-full-setup.sh

      - name: Run this shard's e2e tests (${{ matrix.shard }}/5)
        id: e2e
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
          TEST_CSI_STORAGE_CLASS: csi-hostpath-sc
          TEST_CSI_ATTACH_STORAGE_CLASS: csi-hostpath-sc
          TEST_CSI_INLINE_DRIVER: hostpath.csi.k8s.io
          TEST_CSI_BLOCK_STORAGE_CLASS: csi-hostpath-block-sc
          TEST_CSI_STORAGE_CLASS_WAIT: csi-hostpath-sc-wait
          NOTK8S_E2E_DEBUG_ON_FAIL: "1"
          NOTK8S_E2E_MAX_FAILURES: "3"
        run: |
          set +e
          # Round 123 (found live in CI): every kubectl invocation in this
          # job was printing "kuberc: no preferences loaded from
          # ~/.kube/kuberc: ... permission denied" to stderr — the earlier
          # 'Build and deploy' step runs under sudo -E (HOME preserved as
          # /home/runner but the process itself is root), so kubectl's own
          # kuberc preferences-file lookup there created ~/.kube root-owned;
          # this step's own kubectl calls run as the unprivileged runner
          # user and can't read it. Harmless on its own, but multiple
          # tests capture a command's combined stdout+stderr (2>&1) and
          # got this warning silently prepended to their real value,
          # corrupting numeric/uid assertions in a way that took several
          # rounds to actually trace back to this. Fixing ownership here
          # is cheaper than auditing every kubectl-output capture in the
          # suite for the same latent bug.
          sudo chown -R "$(id -u):$(id -g)" ~/.kube 2>/dev/null || sudo rm -rf ~/.kube
          ONLY_FLAG=""
          if [ -n "${{ inputs.only }}" ]; then
            ONLY_FLAG="--only=${{ inputs.only }}"
          fi
          # shellcheck disable=SC2086
          ./deploy/test-e2e.sh --shard=${{ matrix.shard }}/5 $ONLY_FLAG 2>&1 | tee /tmp/e2e-raw.txt
          exit_code=${PIPESTATUS[0]}
          # Strip ANSI color codes for a clean plain-text results file.
          sed -r 's/\x1b\[[0-9;]*m//g' /tmp/e2e-raw.txt > /tmp/e2e-results.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      # Runs if driver setup timed out/failed, or the e2e suite itself
      # reported a failing/erroring test — node/taint status, disk
      # space, and nodelet's own service status + logs weren't visible
      # anywhere before this. See e2e-debug-dump.sh's own doc comment.
      - name: Dump debug info (node/taints/disk/nodelet logs) on failure
        if: failure() || steps.e2e.outputs.exit_code != '0'
        run: bash deploy/lib/e2e-debug-dump.sh

      - name: Publish results to the e2e-results branch
        if: always()
        env:
          RESULTS_BRANCH: e2e-results
          RUN_EXIT_CODE: ${{ steps.e2e.outputs.exit_code }}
          SHARD: ${{ matrix.shard }}
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "shard: ${SHARD}/5"
            echo "exit code: ${RUN_EXIT_CODE:-unknown}"
            echo "----------------------------------------"
            cat /tmp/e2e-results.txt 2>/dev/null || echo "(no results captured — the run failed before test-e2e.sh could produce output)"
          } > /tmp/e2e-results-final.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Found live: the run itself dirties the working tree — a build
          # updates Cargo.lock — and `git checkout -B` then refuses with
          # "your local changes would be overwritten", failing an e2e run
          # that had already produced its results. Publishing results must
          # not depend on the tree being pristine, so discard whatever the
          # build touched first. Nothing here is worth keeping: this job
          # publishes a text file and then the runner is destroyed.
          git reset --hard HEAD

          if git ls-remote --exit-code --heads origin "$RESULTS_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RESULTS_BRANCH"
            git checkout -B "$RESULTS_BRANCH" "origin/$RESULTS_BRANCH"
          else
            git checkout --orphan "$RESULTS_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # One file per shard, and a merge-rather-than-force push: five jobs
          # finish at unpredictable times, and --force from each of them would
          # leave whichever pushed last as the only surviving result. Retry
          # around the race where two shards push between one's fetch and its
          # own push.
          cp /tmp/e2e-results-final.txt "results-shard-${SHARD}.txt"
          git add "results-shard-${SHARD}.txt"
          git commit -m "e2e results (shard ${SHARD}/5) for ${GITHUB_SHA:0:12}" --allow-empty
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$RESULTS_BRANCH"; then
              break
            fi
            echo "push rejected (another shard got there first); rebasing onto it — attempt $attempt"
            git fetch origin "$RESULTS_BRANCH"
            git rebase "origin/$RESULTS_BRANCH" || git rebase --abort
            sleep $((attempt * 5))
          done

      - name: Fail the job if the e2e suite failed
        if: steps.e2e.outputs.exit_code != '0'
        run: exit 1
