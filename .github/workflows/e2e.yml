name: Bootstrap e2e

# Manual real-infrastructure validation for the Rust bootstrap applet. The
# Rust runner keeps the former five-way CI shape: CSI/DRA tests are assigned
# across shards 1-2, while all other tests are assigned across shards 1-5.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional test-name substring or comma-separated substrings'
        required: false
        default: ''
      proxy:
        description: 'Install nodeproxy or omit it for an apiserver-only check'
        required: false
        default: nodeproxy
        type: choice
        options: [nodeproxy, none]
      network:
        description: 'Use flannel or exercise the external-CNI bootstrap path'
        required: false
        default: flannel
        type: choice
        options: [flannel, external]

permissions:
  contents: write

jobs:
  prepare-e2e-results:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository for results reset
        uses: actions/checkout@v7

      - name: Clear the e2e-results branch for this run
        env:
          RESULTS_BRANCH: e2e-results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$RESULTS_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cat > README.md <<EOF
          # e2e results

          - commit: $GITHUB_SHA
          - workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - started (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Each shard writes its complete output to results-shard-N.txt.
          EOF
          git add README.md
          git commit -m "e2e results: start run ${GITHUB_SHA:0:12}"
          git push --force origin "HEAD:$RESULTS_BRANCH"

  build-source-runtime:
    needs: prepare-e2e-results
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Build the host bootstrapper
        run: cargo build -p nodebootstrap

      - name: Prepare the x86_64 static musl target
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools musl-dev linux-libc-dev

      - name: Build the combined debug runtime through nodebootstrap
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/e2e-source-stage"
          rm -rf "$stage" e2e-bin
          mkdir -p e2e-bin
          NODEBOOTSTRAP_ARCH=x86_64 \
          NODEBOOTSTRAP_REPO_ROOT="$GITHUB_WORKSPACE" \
          NODEBOOTSTRAP_TOOLCHAIN_DIR="$stage" \
          NODEBOOTSTRAP_SOURCE=compile \
          NOTK8S_BUILD_LAYOUT=combined \
          NOTK8S_BUILD_PROFILE=debug \
            ./target/debug/nodebootstrap fetch
          install -m0755 "$stage/bin/nodebootstrap" e2e-bin/nodebootstrap
          install -m0755 "$stage/bin/notk8s" e2e-bin/notk8s

      - uses: actions/upload-artifact@v4
        with:
          name: nodebootstrap-e2e-source-${{ github.run_id }}
          path: e2e-bin/
          # GitHub's minimum is one day; cleanup-e2e-artifact removes this
          # run-scoped artifact as soon as every shard has consumed it.
          retention-days: 1

  plan-e2e:
    needs: build-source-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: nodebootstrap-e2e-source-${{ github.run_id }}
          path: dist-bin

      - name: Plan only non-empty shards
        id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          chmod +x dist-bin/nodebootstrap
          args=(--e2e-list)
          [[ -z "$ONLY" ]] || args+=("--only=$ONLY")
          matrix='{"include":[]}'
          for shard in 1 2 3 4 5; do
            selected="$(./dist-bin/nodebootstrap "${args[@]}" "--shard=${shard}/5")"
            if [[ -n "$selected" ]]; then
              if (( shard <= 2 )); then
                needs_drivers=true
              else
                needs_drivers=false
              fi
              matrix="$(jq -c --argjson shard "$shard" --argjson needs_drivers "$needs_drivers" \
                '.include += [{shard: $shard, needs_drivers: $needs_drivers}]' <<<"$matrix")"
            fi
          done
          echo "$matrix" | tee /tmp/e2e-matrix.json
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [prepare-e2e-results, build-source-runtime, plan-e2e]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-e2e.outputs.matrix).include }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: nodebootstrap-e2e-source-${{ github.run_id }}
          path: dist-bin

      - name: Bootstrap a real cluster with Rust
        env:
          PROXY: ${{ inputs.proxy }}
          NETWORK: ${{ inputs.network }}
        run: |
          set -euo pipefail
          args=(bootstrap \
            --layout=combined \
            --proxy="$PROXY" \
            --datastore=nodestore \
            --scheduler=nodescheduler \
            --controller-manager=nodecontroller)
          if [[ "$NETWORK" == external ]]; then
            args+=(--without-flannel --proxy=none)
          fi
          chmod +x dist-bin/nodebootstrap dist-bin/notk8s
          sudo -E env \
            NOTK8S_COMBINED_PREBUILT="$GITHUB_WORKSPACE/dist-bin/notk8s" \
            NOTK8S_BUILD_LAYOUT=combined \
            ./dist-bin/nodebootstrap "${args[@]:1}"

      - name: Make the admin kubeconfig readable
        run: sudo chmod 644 /etc/nodebootstrap/admin.kubeconfig

      - name: Install reference CSI and DRA drivers on shards 1 and 2
        if: matrix.needs_drivers
        env:
          KUBECONFIG: /etc/nodebootstrap/admin.kubeconfig
        run: |
          set -euo pipefail
          # The test cases are Rust now, but the real reference-driver
          # deployment helper remains archived with the old harness. Fetch it
          # only for the two driver shards; it is not part of the release tree.
          git fetch --no-tags --depth=1 origin archive-shell-scripts-0.7.1
          git show FETCH_HEAD:deploy/lib/e2e-full-setup.sh > /tmp/nodebootstrap-e2e-full-setup.sh
          chmod +x /tmp/nodebootstrap-e2e-full-setup.sh
          sudo -E timeout 600 bash /tmp/nodebootstrap-e2e-full-setup.sh

      - name: Run bootstrap-native e2e checks
        id: e2e
        env:
          KUBECONFIG: /etc/nodebootstrap/admin.kubeconfig
          ONLY: ${{ inputs.only }}
        run: |
          set +e
          if [[ "${{ matrix.needs_drivers }}" == true ]]; then
            export TEST_DRA_DEVICE_CLASS=gpu.example.com
            export TEST_CSI_STORAGE_CLASS=csi-hostpath-sc
            export TEST_CSI_ATTACH_STORAGE_CLASS=csi-hostpath-sc
            export TEST_CSI_INLINE_DRIVER=hostpath.csi.k8s.io
            export TEST_CSI_BLOCK_STORAGE_CLASS=csi-hostpath-block-sc
            export TEST_CSI_STORAGE_CLASS_WAIT=csi-hostpath-sc-wait
          fi
          args=(bootstrap --e2e --shard=${{ matrix.shard }}/5)
          if [[ "${{ inputs.network }}" == external && -z "$ONLY" ]]; then
            ONLY=external_cni
          fi
          [[ -z "$ONLY" ]] || args+=("--only=$ONLY")
          ./dist-bin/nodebootstrap "${args[@]:1}" 2>&1 | tee /tmp/e2e-raw.txt
          exit_code=${PIPESTATUS[0]}
          sed -r 's/\x1b\[[0-9;]*m//g' /tmp/e2e-raw.txt > /tmp/e2e-results.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate worker bootstrap without flannel or proxy
        if: matrix.shard == 5 && steps.e2e.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          sudo -E env \
            NOTK8S_COMBINED_PREBUILT="$GITHUB_WORKSPACE/dist-bin/notk8s" \
            NOTK8S_BUILD_LAYOUT=combined \
            ./dist-bin/nodebootstrap \
              --worker \
              --kubeconfig=/etc/nodebootstrap/admin.kubeconfig \
              --without-flannel \
              --proxy=none \
              --skip-nodelet

      - name: Dump all service state and logs on failure
        if: failure() || steps.e2e.outputs.exit_code != '0'
        run: |
          set +e
          export KUBECONFIG=/etc/nodebootstrap/admin.kubeconfig
          kubectl_cmd() {
            sudo kubectl --kubeconfig "$KUBECONFIG" --request-timeout=30s "$@"
          }

          echo "=========================================="
          echo "all service state and logs on failure: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "=========================================="
          echo "── disk space ──"
          df -h /

          echo "── node status ──"
          kubectl_cmd get nodes -o wide
          kubectl_cmd describe nodes
          echo "── all pods (every namespace) ──"
          kubectl_cmd get pods -A -o wide
          echo "── pods not Running/Completed ──"
          kubectl_cmd get pods -A -o wide | awk 'NR==1 || ($4 !~ /Running|Completed/)'

          for unit in kube-apiserver nodestore nodelet nodeproxy nodescheduler nodecontroller flanneld containerd; do
            echo "── $unit.service status ──"
            sudo systemctl status "$unit.service" --no-pager -l || true
            echo "── $unit.service logs (last 300 lines) ──"
            sudo journalctl -u "$unit.service" --no-pager -n 300 || true
          done

          echo "── scheduler lease ──"
          kubectl_cmd get lease kube-scheduler -n kube-system -o yaml | head -30
          echo "── controller-manager lease ──"
          kubectl_cmd get lease kube-controller-manager -n kube-system -o yaml | head -30
          echo "── kube-apiserver request/readiness signals ──"
          sudo journalctl -u kube-apiserver.service --no-pager -n 800 \
            | grep -iE '429|retry-after|watchlist|priority|fairness|inflight|readyz|error|failed' || true
          echo "── nodecontroller volume/attach signals ──"
          sudo journalctl -u nodecontroller.service --no-pager -n 1200 \
            | grep -iE 'attachdetach|volumeattachment|persistentvolume|reconciler|csidriver|csinode|nodeipam|cidr|desiredstateofworld|actualstateofworld|populat' || true

          echo "── volumeattachments ──"
          kubectl_cmd get volumeattachments.storage.k8s.io -o wide
          echo "── csidrivers ──"
          kubectl_cmd get csidrivers.storage.k8s.io -o yaml
          echo "── csinodes ──"
          kubectl_cmd get csinodes.storage.k8s.io -o yaml
          echo "── recent events (last 100) ──"
          kubectl_cmd get events -A --sort-by=.lastTimestamp | tail -100

          echo "── controller RBAC and authorization ──"
          kubectl_cmd get clusterrole system:controller:replicaset-controller -o yaml
          kubectl_cmd get clusterrolebindings -o yaml \
            | grep -B5 -A15 'name: replicaset-controller\|controller-sa-replicaset-controller' || true
          kubectl_cmd auth can-i patch replicasets/status \
            --as=system:serviceaccount:kube-system:replicaset-controller -n kube-system
          kubectl_cmd auth can-i update replicasets/status \
            --as=system:serviceaccount:kube-system:replicaset-controller -n kube-system
          kubectl_cmd auth can-i patch endpointslices \
            --as=system:serviceaccount:kube-system:endpointslice-controller -n kube-system
          kubectl_cmd auth can-i update endpointslices \
            --as=system:serviceaccount:kube-system:endpointslice-controller -n kube-system
          kubectl_cmd get clusterrole system:controller:endpointslice-controller -o yaml
          echo "=========================================="
          echo "all service state and logs on failure: end"
          echo "=========================================="

      - name: Publish this shard's e2e results
        if: always()
        env:
          RESULTS_BRANCH: e2e-results
          RUN_EXIT_CODE: ${{ steps.e2e.outputs.exit_code }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          {
            echo "commit: $GITHUB_SHA"
            echo "workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "shard: ${SHARD}/5"
            echo "exit code: ${RUN_EXIT_CODE:-unknown}"
            echo "----------------------------------------"
            cat /tmp/e2e-results.txt 2>/dev/null || echo "(no results captured — the job failed before the Rust e2e runner started)"
          } > /tmp/e2e-results-final.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git fetch origin "$RESULTS_BRANCH"
          git checkout -B "$RESULTS_BRANCH" "origin/$RESULTS_BRANCH"
          cp /tmp/e2e-results-final.txt "results-shard-${SHARD}.txt"
          git add "results-shard-${SHARD}.txt"
          git commit -m "e2e results: shard ${SHARD}/5 for ${GITHUB_SHA:0:12}"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$RESULTS_BRANCH"; then
              pushed=true
              break
            fi
            echo "results branch changed concurrently; rebasing (attempt $attempt)"
            git fetch origin "$RESULTS_BRANCH"
            git rebase "origin/$RESULTS_BRANCH"
            sleep $((attempt * 5))
          done
          [[ "$pushed" == true ]]

      - name: Fail the job if the e2e suite failed
        if: steps.e2e.outputs.exit_code != '0'
        run: exit 1

  cleanup-e2e-artifact:
    needs: [build-source-runtime, e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the run-scoped source artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == ("nodebootstrap-e2e-source-" + env.GITHUB_RUN_ID)) | .id' \
            | head -n1)"
          if [[ -n "$artifact_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          fi
