name: Bootstrap e2e

# Manual real-infrastructure validation for the Rust bootstrap applet. The
# Rust runner keeps the former five-way CI shape: CSI/DRA tests are assigned
# across shards 1-2, while all other tests are assigned across shards 1-5.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional test-name substring or comma-separated substrings'
        required: false
        default: ''
      proxy:
        description: 'Install nodeproxy or omit it for an apiserver-only check'
        required: false
        default: nodeproxy
        type: choice
        options: [nodeproxy, none]
      network:
        description: 'Use flannel or exercise the external-CNI bootstrap path'
        required: false
        default: flannel
        type: choice
        options: [flannel, external]

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            needs_drivers: true
          - shard: 2
            needs_drivers: true
          - shard: 3
            needs_drivers: false
          - shard: 4
            needs_drivers: false
          - shard: 5
            needs_drivers: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Build the combined bootstrap applet
        run: cargo build --features cri -p notk8s

      - name: Bootstrap a real cluster with Rust
        env:
          PROXY: ${{ inputs.proxy }}
          NETWORK: ${{ inputs.network }}
        run: |
          set -euo pipefail
          args=(bootstrap \
            --layout=combined \
            --proxy="$PROXY" \
            --datastore=nodestore \
            --scheduler=nodescheduler \
            --controller-manager=nodecontroller)
          if [[ "$NETWORK" == external ]]; then
            args+=(--without-flannel --proxy=none)
          fi
          sudo -E ./target/debug/notk8s "${args[@]}"

      - name: Make the admin kubeconfig readable
        run: sudo chmod 644 /etc/nodebootstrap/admin.kubeconfig

      - name: Run bootstrap-native e2e checks
        env:
          KUBECONFIG: /etc/nodebootstrap/admin.kubeconfig
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          args=(bootstrap --e2e --shard=${{ matrix.shard }}/5)
          if [[ "${{ inputs.network }}" == external && -z "$ONLY" ]]; then
            ONLY=external_cni
          fi
          [[ -z "$ONLY" ]] || args+=("--only=$ONLY")
          ./target/debug/notk8s "${args[@]}"

      - name: Validate worker bootstrap without flannel or proxy
        run: |
          set -euo pipefail
          sudo -E ./target/debug/notk8s bootstrap \
            --worker \
            --kubeconfig=/etc/nodebootstrap/admin.kubeconfig \
            --without-flannel \
            --proxy=none \
            --skip-nodelet

      - name: Dump bootstrap service state on failure
        if: failure()
        run: |
          sudo systemctl --no-pager --full status kube-apiserver nodestore nodelet nodeproxy nodescheduler nodecontroller flanneld || true
          for unit in kube-apiserver nodestore nodelet nodeproxy nodescheduler nodecontroller flanneld; do
            sudo journalctl -u "$unit" -n 80 --no-pager || true
          done
