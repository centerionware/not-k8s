name: Profiling script checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/*profil*.py'
      - 'deploy/*profil*.sh'
      - 'deploy/lib/render-perf.sh'
      - 'deploy/lib/render-stack-charts.py'
      - '.github/workflows/*profil*.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/e2e.yml'
      - '.github/actions/**'
      - 'deploy/*release*.py'
      - 'deploy/*release*.sh'
      - 'deploy/publish-validation-results.sh'
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash -n deploy/profile-process.sh deploy/lib/render-perf.sh deploy/publish-stack-profile.sh deploy/setup-profile-baseline.sh deploy/publish-profile-comparison.sh
      - run: bash -n deploy/download-release-runtime.sh deploy/publish-validation-results.sh
      - run: python3 -m pip install --quiet --break-system-packages matplotlib numpy pyyaml
      - run: python3 -B deploy/test-profile-stack.py
      - run: python3 -B deploy/test-release-validation.py
