name: nodemigrate checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/check_nodemigrate_release.py'
      - '.github/workflows/build.yml'
      - '.github/workflows/nodemigrate.yml'
      - '.github/workflows/release.yml'
      - 'crates/nodemigrate/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crate_exists: ${{ steps.detect.outputs.crate_exists }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect crate
        id: detect
        run: |
          if [[ -f crates/nodemigrate/Cargo.toml ]]; then
            echo "crate_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "crate_exists=false" >> "$GITHUB_OUTPUT"
          fi

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release hooks
        run: python3 .github/scripts/check_nodemigrate_release.py

  crate-tests:
    needs: detect
    if: ${{ needs.detect.outputs.crate_exists == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Test nodemigrate
        env:
          CARGO_TERM_COLOR: never
          NODEMIGRATE_TEST_LOG: ${{ runner.temp }}/nodemigrate-tests.log
        run: |
          set -o pipefail
          cargo --color never test -p nodemigrate 2>&1 | tee "$NODEMIGRATE_TEST_LOG"
      - name: Summarize test log
        if: failure()
        run: |
          {
            echo '### Nodemigrate test failure details'
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/nodemigrate-tests.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nodemigrate-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/nodemigrate-tests.log
          if-no-files-found: warn
          retention-days: 7
