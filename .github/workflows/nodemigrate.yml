name: nodemigrate checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/check_nodemigrate_release.py'
      - '.github/workflows/build.yml'
      - '.github/workflows/nodemigrate.yml'
      - '.github/workflows/release.yml'
      - 'crates/nodemigrate/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release hooks
        run: python3 .github/scripts/check_nodemigrate_release.py

  crate-tests:
    if: ${{ hashFiles('crates/nodemigrate/Cargo.toml') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Test nodemigrate
        run: cargo test -p nodemigrate
