name: Flamegraph

# Manual trigger only, same conservative posture as profiling.yml/e2e.yml.
#
# Purpose: capture a real CPU flame graph of nodelet across a workload's
# full lifecycle (create N namespaces/pods -> all Ready -> idle -> delete
# all -> all gone) against a real CRI runtime, to get real data on issue
# #133 (nodelet using far more idle CPU than kubelet once real pods are
# running) instead of guessing from reading source.
#
# pod_count defaults to 10, matching #133's own reported reproduction shape
# (profiling.yml's workload_pod_count) — a single pod was tried first and
# turned out to be the wrong experiment: nodelet was almost entirely idle
# for the whole ~24s a lone pod's lifecycle takes (perf only caught 3
# samples total), too sparse to show anything. Real per-pod cluster
# activity (ConfigMap/Secret churn, periodic loops with more to look at)
# needs more than one pod actually present to have anything to sample.
#
# Still deliberately narrower than profiling.yml itself: nodelet only, no
# kubelet leg (this isn't a comparison run, it's a profile of one process
# — nothing here builds or runs upstream-kubelet.sh), and no RSS/CPU%
# aggregate measurement (that's profiling.yml's own job) — this exists
# purely to answer "where is nodelet's own CPU time actually going."
#
# The debug binary (not the LTO/stripped release one) is used deliberately:
# a flame graph is only useful with real function names and unmerged frames.
# The debug release asset is handed to the Rust bootstrap applet via
# NOTK8S_NODELET_PREBUILT (the same prebuilt seam used by normal deployments),
# so the profile keeps symbols without a second installer path.
#
# A follow-up, broader version of this workflow (every component, not just
# nodelet) is real future work, not done here — see the flamegraphs branch's
# own README for that note once it exists.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to fetch nodelet's debug binary from (e.g. v0.6.0). Empty = latest."
        required: false
        default: ""
      pod_count:
        description: "Number of namespaces (one pod each) to spin up/idle/tear down — matches #133's own reproduction shape"
        required: false
        default: "10"
        type: string
      idle_seconds:
        description: "How long to stay idle with every pod Ready before deleting them"
        required: false
        default: "15"
        type: string
      sample_seconds:
        description: "Safety-cap ceiling on the perf sampling window — recording stops as soon as the real workload lifecycle finishes, well before this in the normal case"
        required: false
        default: "180"
        type: string

permissions:
  contents: write

jobs:
  flamegraph:
    runs-on: ubuntu-latest
    # 10 pods sequentially `kubectl wait`'d on a small shared GH-hosted
    # runner genuinely took past 20 minutes in the first real dispatch
    # (job-level cancellation, not a hang — no per-step diagnostic, just a
    # silent "cancelled" with nothing published). 45 gives real headroom;
    # the "Record a flame graph" step below now has its own tighter
    # per-step timeout so a genuine hang there fails loud with real
    # kubectl/perf output instead of a silent whole-job cancellation.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download nodelet
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          ASSET="nodelet-${VERSION}-linux-x86_64-debug"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          gh release download "$TAG" --repo "${{ github.repository }}" -p "$ASSET" -O /tmp/nodelet-debug
          chmod +x /tmp/nodelet-debug
          file /tmp/nodelet-debug

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build bootstrap
        run: cargo build --features cri -p notk8s

      - name: Bootstrap cluster
        run: |
          set -euo pipefail
          sudo -E env NOTK8S_NODELET_PREBUILT=/tmp/nodelet-debug \
            ./target/debug/notk8s bootstrap --proxy=none

      - name: Settle cluster
        run: sleep 15

      - name: Record flamegraph
        timeout-minutes: 25
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          set -e
          sudo chmod +x deploy/profile-process.sh
          COUNT="${{ inputs.pod_count }}"
          NS_PREFIX="flamegraph-wl"

          # --stop-file: perf records for exactly as long as the real
          # workload below actually takes (create -> all Ready -> idle ->
          # delete all -> all gone), not a pre-guessed fixed window —
          # there's nothing useful to sample once every pod's already torn
          # down, so padding the recording past that would only dilute the
          # flame graph with idle-nodelet frames. --duration is still
          # passed as a safety-cap ceiling in case this stop-file is
          # somehow never created (a failed kubectl step, etc.).
          STOP_FILE="$(mktemp -u /tmp/flamegraph-stop.XXXXXX)"
          rm -f "$STOP_FILE"

          sudo ./deploy/profile-process.sh --pattern nodelet --label nodelet-workload-lifecycle \
            --duration "${{ inputs.sample_seconds }}" --stop-file "$STOP_FILE" --journal-unit nodelet \
            --output /tmp/flamegraph-out &
          PROFILE_PID=$!

          # Give profile-process.sh a moment to find the PID and attach perf
          # before generating any load, so the very start of the sample
          # isn't wasted on process discovery.
          sleep 3

          echo "==> creating $COUNT namespace(s), one plain nginx pod each"
          for i in $(seq 0 $((COUNT - 1))); do
            ns="${NS_PREFIX}-${i}"
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
            kubectl apply -n "$ns" -f - >/dev/null <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: workload
            namespace: $ns
          spec:
            containers:
              - name: app
                image: nginx:1.27-alpine
                ports:
                  - containerPort: 80
          EOF
          done
          # 60s per pod, not the 120s default: the first real dispatch (10
          # pods) blew through this whole job's 20-minute timeout with no
          # per-pod signal of where the time actually went (a silent
          # whole-job cancellation, nothing published) -- logging each
          # pod's own wait here means a repeat is diagnosable from the log
          # instead of a mystery, and a tighter per-pod cap bounds the
          # worst case (COUNT * 60s) to something this step's own 25-minute
          # timeout can still fail loud within, rather than the whole job
          # silently getting cancelled out from under it.
          for i in $(seq 0 $((COUNT - 1))); do
            echo "==> waiting for pod $((i + 1))/$COUNT (${NS_PREFIX}-${i}) to be Ready"
            kubectl wait --for=condition=Ready "pod/workload" -n "${NS_PREFIX}-${i}" --timeout=60s
          done
          echo "==> all $COUNT pods Ready"

          echo "==> idle ${{ inputs.idle_seconds }}s with every pod Ready"
          sleep "${{ inputs.idle_seconds }}"

          echo "==> deleting all $COUNT namespaces"
          for i in $(seq 0 $((COUNT - 1))); do
            kubectl delete namespace "${NS_PREFIX}-${i}" --wait=false >/dev/null 2>&1 || true
          done
          for i in $(seq 0 $((COUNT - 1))); do
            ns="${NS_PREFIX}-${i}"
            echo "==> waiting for namespace $((i + 1))/$COUNT ($ns) to be gone"
            for _ in $(seq 1 60); do
              kubectl get namespace "$ns" >/dev/null 2>&1 || break
              sleep 1
            done
          done
          echo "==> all namespaces gone; signaling profile-process.sh to stop recording now"

          touch "$STOP_FILE"
          wait "$PROFILE_PID"
          rm -f "$STOP_FILE"
          ls -la /tmp/flamegraph-out

      - name: Upload profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodelet-flamegraph-${{ steps.resolve.outputs.tag }}-run${{ github.run_id }}
          path: /tmp/flamegraph-out/
          if-no-files-found: warn

      - name: Publish flamegraph
        if: always()
        run: |
          set -e
          [[ -s /tmp/flamegraph-out/flamegraph.svg ]] || { echo "no flamegraph.svg produced — nothing to publish (see the uploaded artifact for why)" >&2; exit 0; }

          git config --global user.name "not-k8s-profiling-bot"
          git config --global user.email "actions@users.noreply.github.com"
          AUTH_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          WORKDIR="$(mktemp -d)"

          if git ls-remote --exit-code --heads "$AUTH_URL" flamegraphs >/dev/null 2>&1; then
            git clone --branch flamegraphs --single-branch "$AUTH_URL" "$WORKDIR"
          else
            git clone "$AUTH_URL" "$WORKDIR"
            (cd "$WORKDIR" && git checkout --orphan flamegraphs && git rm -rf . >/dev/null 2>&1 || true)
          fi

          STAMP="$(date -u +%Y-%m-%dT%H%M%SZ)"
          DEST="$WORKDIR/nodelet/${{ steps.resolve.outputs.tag }}/${STAMP}-run${{ github.run_id }}"
          mkdir -p "$DEST"
          cp -r /tmp/flamegraph-out/. "$DEST/"

          cat > "$DEST/README.md" <<EOF
          # nodelet flame graph — ${{ steps.resolve.outputs.tag }}

          Workload lifecycle: create ${{ inputs.pod_count }} namespace(s),
          one plain \`nginx:1.27-alpine\` pod each (no probes), wait for all
          \`Ready\`, idle ${{ inputs.idle_seconds }}s with all of them
          running, delete every namespace, wait for all of them gone.
          \`deploy/profile-process.sh\` attached to the real nodelet PID
          (\`perf record -F 99 --call-graph dwarf\`, real debug binary —
          ${{ steps.resolve.outputs.asset }}) for exactly that window —
          stopped the moment every namespace was confirmed gone
          (\`--stop-file\`), not a pre-guessed fixed duration, so nothing here
          is diluted by idle-nodelet-with-nothing-happening frames.
          ${{ inputs.sample_seconds }}s was the safety-cap ceiling, not the
          actual sample length.

          - \`flamegraph.svg\` — open directly in a browser.
          - \`perf-report.txt\` / \`perf-self-report.txt\` — textual top-functions
            breakdown (inclusive / self time).
          - \`top-functions.txt\` — the same, pre-sorted top 20.
          - \`nodelet-workload-lifecycle-journal.txt\` — nodelet's own log lines for the sample window.
          - \`process.txt\` — PID/executable/cmdline identity.

          Captured from: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Repo commit: $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)

          Related: #133
          EOF

          cd "$WORKDIR"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to publish"
          else
            git commit -m "flamegraph: nodelet workload lifecycle (${{ inputs.pod_count }} pods, ${{ steps.resolve.outputs.tag }}, run ${{ github.run_id }})"
            git push origin flamegraphs
          fi

      - name: Show results
        if: always()
        run: |
          echo "Workflow artifact: see this run's Artifacts section."
          echo "flamegraphs branch: https://github.com/${{ github.repository }}/tree/flamegraphs/nodelet/${{ steps.resolve.outputs.tag }}"
