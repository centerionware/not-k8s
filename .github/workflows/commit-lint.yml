name: Commit convention

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test the subject validator
        run: python3 .github/scripts/test_commit_subjects.py

      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/commit_subjects.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Check the PR title
        if: always()
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/commit_subjects.py --subject "$PR_TITLE"
