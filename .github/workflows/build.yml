name: Build + unit tests (artifacts)

# Manual, no e2e, no release. This is the "I want binaries to try on a real
# device, and I want to know the code compiles and the unit tests pass"
# workflow — the fast path for development on a host that can't build this
# project itself (a memory-constrained phone VM, where a full
# `cargo build --release --features cri` has OOM-killed the whole box, not
# just rustc — see deploy/lib/nodelet-build.sh's own header).
#
# Difference from the other three workflows:
#   - release.yml  — the real gate: build+test, full e2e, cross builds,
#                    version bump, tag, GitHub Release. 30-40+ min.
#   - e2e.yml      — a real cluster + the e2e suite, optionally filtered.
#   - build.yml    — this one. Compiles and unit-tests both crates, both
#                    feature sets, and uploads the binaries as run
#                    artifacts. No cluster, no sudo cluster access, no
#                    release, nothing published. Minutes, not tens of them.
#
# Artifacts land on the run's own page (Actions -> this run -> Artifacts)
# and via `gh run download <run-id>`, so a device can fetch a binary built
# here and point deploy/bootstrap-source.sh at it:
#
#   gh run download <run-id> -n notk8s-x86_64-debug -D /tmp/bins
#   chmod +x /tmp/bins/nodelet /tmp/bins/nodeproxy
#   sudo NOTK8S_NODELET_PREBUILT=/tmp/bins/nodelet \
#        NOTK8S_NODEPROXY_PREBUILT=/tmp/bins/nodeproxy \
#        ./deploy/bootstrap-source.sh --with-cri
#
# The same artifact also carries the combined single-binary layout when the
# `layout` input includes it (`notk8s` — every component in one executable,
# dispatching on argv[0]). Deploy that one instead with:
#
#   sudo NOTK8S_COMBINED_PREBUILT=/tmp/bins/notk8s \
#        ./deploy/bootstrap-source.sh --with-cri --layout=combined
#
# (Those two env vars are nodelet-build.sh's existing prebuilt seam — the
# same one release.yml's e2e shards use — so no toolchain is installed on
# the target device at all.)
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Which cargo profile(s) to build: debug (fast, default), release (optimized, ~5x slower), or both.'
        required: false
        default: debug
        type: choice
        options: [debug, release, both]
      arch:
        description: 'Which architecture(s) to build for.'
        required: false
        default: x86_64
        type: choice
        options: [x86_64, aarch64, armv7l, all]
      layout:
        description: 'Which build layout(s): split (one binary per component), combined (single multi-call notk8s binary), or both.'
        required: false
        default: both
        type: choice
        options: [split, combined, both]
      skip_tests:
        description: 'Skip the unit tests and only produce binaries.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Unit tests run once, on x86_64 only — they exercise architecture-neutral
  # logic, and running them again per cross target would just pay the same
  # cost three times. The build matrix below is what varies by arch.
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: cargo test (nodelet both feature sets, nodeproxy)
        # Under sudo for the same reason release.yml's own test step is:
        # nodeproxy's svc.rs nft_check() tests open real netlink/nftables
        # sockets to validate generated ruleset syntax, which needs
        # CAP_NET_ADMIN. sudo -E preserves PATH/CARGO_HOME/RUSTUP_HOME
        # that setup-toolchain put in $GITHUB_ENV/$GITHUB_PATH.
        run: |
          set -e
          sudo -E env "PATH=$PATH" cargo test -p nodelet
          sudo -E env "PATH=$PATH" cargo test -p nodelet --features cri
          # Guarded so this workflow is correct on any ref, including one
          # where the nodeproxy crate doesn't exist yet. Without it, a
          # dispatch against a branch predating the split fails on a
          # package cargo has never heard of.
          if [[ -d crates/nodeproxy ]]; then
            sudo -E env "PATH=$PATH" cargo test -p nodeproxy
          else
            echo "crates/nodeproxy not present on this ref — skipping its tests."
          fi
          # Same guard, same reason: the combined-binary crate postdates
          # both of the above.
          if [[ -d crates/notk8s ]]; then
            sudo -E env "PATH=$PATH" cargo test -p notk8s
          else
            echo "crates/notk8s not present on this ref — skipping its tests."
          fi

  build:
    strategy:
      # Don't cancel the other architectures because one failed — the same
      # reasoning as release.yml's build-release matrix.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cross: false
          - arch: armv7l
            target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Skip this architecture?
        id: want
        run: |
          if [[ "${{ inputs.arch }}" == "all" || "${{ inputs.arch }}" == "${{ matrix.arch }}" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "arch=${{ matrix.arch }} not requested (inputs.arch=${{ inputs.arch }}) — nothing to do."
          fi

      - uses: ./.github/actions/setup-toolchain
        if: steps.want.outputs.build == 'true'

      - name: Add cross target + linker (armv7l only)
        if: steps.want.outputs.build == 'true' && matrix.cross
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf
          rustup target add armv7-unknown-linux-gnueabihf
          {
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc"
            echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc"
            # protoc runs on the build host to generate code, not on the
            # target — no cross protoc needed.
            echo "PROTOC=$(command -v protoc)"
          } >> "$GITHUB_ENV"

      - name: Build
        if: steps.want.outputs.build == 'true'
        # Thin LTO / 16 codegen units for CI turnaround, same trade-off
        # release.yml's build-release stage makes: the committed
        # [profile.release] (lto=true, codegen-units=1) exists to shrink
        # the binary a real edge device runs, which is not a property a
        # runner building it cares about. A device that wants the smallest
        # possible binary should still build locally with the committed
        # profile.
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          set -e
          TARGET_FLAG=""
          [[ "${{ matrix.cross }}" == "true" ]] && TARGET_FLAG="--target ${{ matrix.target }}"
          LAYOUT="${{ inputs.layout }}"
          # Default for a dispatch that predates this input existing.
          [[ -n "$LAYOUT" ]] || LAYOUT=both
          want_split()    { [[ "$LAYOUT" == split    || "$LAYOUT" == both ]]; }
          want_combined() { [[ "$LAYOUT" == combined || "$LAYOUT" == both ]]; }
          build_both() { # $1 = extra cargo flags for the profile ("" or --release)
            if want_split; then
              # shellcheck disable=SC2086
              cargo build $1 --features cri -p nodelet $TARGET_FLAG
              # nodeproxy takes no features — it deliberately shares none of
              # nodelet's cri dependency tree (crates/nodeproxy/Cargo.toml).
              # Guarded for the same reason as the test job above: a ref
              # without the crate should build nodelet and say so, not fail.
              if [[ -d crates/nodeproxy ]]; then
                # shellcheck disable=SC2086
                cargo build $1 -p nodeproxy $TARGET_FLAG
              else
                echo "crates/nodeproxy not present on this ref — building nodelet only."
              fi
            fi
            # The combined layout: one binary containing every component
            # (crates/notk8s), for a device that would rather not pay for a
            # second copy of the shared dependency tree.
            if want_combined; then
              if [[ -d crates/notk8s ]]; then
                # shellcheck disable=SC2086
                cargo build $1 --features cri -p notk8s $TARGET_FLAG
              else
                echo "crates/notk8s not present on this ref — no combined binary to build."
              fi
            fi
          }
          case "${{ inputs.profile }}" in
            debug)   build_both "" ;;
            release) build_both --release ;;
            both)    build_both "" ; build_both --release ;;
          esac

      - name: Stage binaries
        if: steps.want.outputs.build == 'true'
        run: |
          set -e
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            SRC_DIR="target/${{ matrix.target }}"
          else
            SRC_DIR="target"
          fi
          for profile in debug release; do
            [[ -d "$SRC_DIR/$profile" ]] || continue
            for bin in nodelet nodeproxy notk8s; do
              [[ -f "$SRC_DIR/$profile/$bin" ]] || continue
              mkdir -p "dist/$profile"
              cp "$SRC_DIR/$profile/$bin" "dist/$profile/$bin"
            done
          done
          ls -laR dist
          # Size is the thing worth eyeballing after the nodeproxy split:
          # if nodeproxy isn't dramatically smaller than nodelet, its
          # dependency tree has crept back toward nodelet's and the split
          # has stopped buying anything. Same check from the other side for
          # the combined binary: it should be close to nodelet alone, not to
          # nodelet + nodeproxy, or it isn't buying anything either.
          du -h dist/*/* | sort -h

      - name: Upload debug binaries
        if: steps.want.outputs.build == 'true' && (inputs.profile == 'debug' || inputs.profile == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: notk8s-${{ matrix.arch }}-debug
          path: dist/debug/
          retention-days: 7
          if-no-files-found: error

      - name: Upload release binaries
        if: steps.want.outputs.build == 'true' && (inputs.profile == 'release' || inputs.profile == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: notk8s-${{ matrix.arch }}-release
          path: dist/release/
          retention-days: 7
          if-no-files-found: error
