name: Build + unit tests (artifacts)

# Manual, no e2e, no release. This is the "I want binaries to try on a real
# device, and I want to know the code compiles and the unit tests pass"
# workflow — the fast path for development on a host that can't build this
# project itself (a memory-constrained phone VM, where a full
# `cargo build --release --features cri` has OOM-killed the whole box, not
# just rustc — the bootstrap applet owns device-side toolchain setup.
#
# Difference from the other three workflows:
#   - release.yml  — the real gate: build+test, full e2e, cross builds,
#                    version bump, tag, GitHub Release. 30-40+ min.
#   - e2e.yml      — a real cluster + the e2e suite, optionally filtered.
#   - build.yml    — this one. Compiles and unit-tests both crates, both
#                    feature sets, and uploads the binaries as run
#                    artifacts. No cluster, no sudo cluster access, no
#                    release, nothing published. Minutes, not tens of them.
#
# Artifacts land on the run's own page (Actions -> this run -> Artifacts)
# and via `gh run download <run-id>`, so a device can fetch a binary built
# here and point the combined binary at the bootstrap applet:
#
#   gh run download <run-id> -n notk8s-x86_64-debug -D /tmp/bins
#   chmod +x /tmp/bins/nodelet /tmp/bins/nodeproxy
#   sudo NOTK8S_NODELET_PREBUILT=/tmp/bins/nodelet \
#        NOTK8S_NODEPROXY_PREBUILT=/tmp/bins/nodeproxy \
#        ./notk8s bootstrap
#
# The same artifact also carries the combined single-binary layout when the
# `layout` input includes it (`notk8s` — every component in one executable,
# dispatching on argv[0]). Deploy that one instead with:
#
#   sudo NOTK8S_COMBINED_PREBUILT=/tmp/bins/notk8s \
#        ./notk8s bootstrap --layout=combined
#
# (Those two env vars are nodelet-build.sh's existing prebuilt seam — the
# same one release.yml's e2e shards use — so no toolchain is installed on
# the target device at all.)
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Which cargo profile(s) to build: debug (fast, default), release (optimized, ~5x slower), or both.'
        required: false
        default: debug
        type: choice
        options: [debug, release, both]
      arch:
        description: 'Which architecture(s) to build for.'
        required: false
        default: x86_64
        type: choice
        options: [x86_64, aarch64, armv7l, all]
      layout:
        description: 'Which build layout(s): split (one binary per component), combined (single multi-call notk8s binary), or both.'
        required: false
        default: both
        type: choice
        options: [split, combined, both]
      skip_tests:
        description: 'Skip the unit tests and only produce binaries.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Unit tests run once, on x86_64 only — they exercise architecture-neutral
  # logic, and running them again per cross target would just pay the same
  # cost three times. The build matrix below is what varies by arch.
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: cargo test (nodelet both feature sets, nodeproxy)
        # Under sudo for the same reason release.yml's own test step is:
        # nodeproxy's svc.rs nft_check() tests open real netlink/nftables
        # sockets to validate generated ruleset syntax, which needs
        # CAP_NET_ADMIN. sudo -E preserves PATH/CARGO_HOME/RUSTUP_HOME
        # that setup-toolchain put in $GITHUB_ENV/$GITHUB_PATH.
        run: |
          set -e
          sudo -E env "PATH=$PATH" cargo test -p nodelet
          sudo -E env "PATH=$PATH" cargo test -p nodelet --features cri
          # Guarded so this workflow is correct on any ref, including one
          # where the nodeproxy crate doesn't exist yet. Without it, a
          # dispatch against a branch predating the split fails on a
          # package cargo has never heard of.
          if [[ -d crates/nodeproxy ]]; then
            sudo -E env "PATH=$PATH" cargo test -p nodeproxy
          else
            echo "crates/nodeproxy not present on this ref — skipping its tests."
          fi
          if [[ -d crates/nodestore ]]; then
            sudo -E env "PATH=$PATH" cargo test -p nodestore
          else
            echo "crates/nodestore not present on this ref — skipping its tests."
          fi
          if [[ -d crates/nodescheduler ]]; then
            sudo -E env "PATH=$PATH" cargo test -p nodescheduler
          else
            echo "crates/nodescheduler not present on this ref — skipping its tests."
          fi
          if [[ -d crates/node-leaderelection ]]; then
            sudo -E env "PATH=$PATH" cargo test -p node-leaderelection
          else
            echo "crates/node-leaderelection not present on this ref — skipping its tests."
          fi
          if [[ -d crates/nodecontroller ]]; then
            sudo -E env "PATH=$PATH" cargo test -p nodecontroller
          else
            echo "crates/nodecontroller not present on this ref — skipping its tests."
          fi
          # Same guard, same reason: the combined-binary crate postdates
          # all of the above.
          if [[ -d crates/notk8s ]]; then
            sudo -E env "PATH=$PATH" cargo test -p notk8s
          else
            echo "crates/notk8s not present on this ref — skipping its tests."
          fi

      # Cargo resolves a changed workspace manifest before compiling. Preserve
      # that exact lockfile as a tiny artifact so contributors on constrained
      # hosts can commit it without running a local toolchain merely to copy
      # CI's resolution. This also prevents a branch from repeatedly testing
      # an uncommitted dependency graph.
      - name: Upload resolved Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

  build:
    strategy:
      # Don't cancel the other architectures because one failed — the same
      # reasoning as release.yml's build-release matrix.
      fail-fast: false
      matrix:
        include:
          # musl, not gnu, and deliberately. A *-linux-gnu build links against
          # the *runner's* glibc, so a binary built on ubuntu-latest (glibc
          # 2.39) refuses to start on anything older with
          # "version `GLIBC_2.39' not found". Measured on real VMs rather than
          # inferred — 4 of 5 test distros could not run the gnu artifact at
          # all: Debian 12 (2.36), Rocky 9 (2.34), openSUSE Leap 15.6 (2.38),
          # Alpine (no glibc whatsoever). Only Arch (2.44) was new enough.
          #
          # Rust's *-linux-musl targets enable crt-static by default, so these
          # link musl *into* the executable and need nothing from the host.
          # That is the deployment story crates/nodestore/Cargo.toml already
          # claims -- "one binary, no runtime dependencies to install" -- and
          # the "Verify static linking" step below turns it from a claim into
          # something the build fails on.
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cross: false
          - arch: armv7l
            target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Skip this architecture?
        id: want
        run: |
          if [[ "${{ inputs.arch }}" == "all" || "${{ inputs.arch }}" == "${{ matrix.arch }}" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "arch=${{ matrix.arch }} not requested (inputs.arch=${{ inputs.arch }}) — nothing to do."
          fi

      - uses: ./.github/actions/setup-toolchain
        if: steps.want.outputs.build == 'true'

      # Every arch needs a musl target now, not just the cross one, so this
      # step is no longer armv7l-only. Two C dependencies make a musl *C*
      # compiler mandatory rather than optional: rusqlite's `bundled` SQLite
      # and rustls's `ring` both compile C/asm, and handing them the host's
      # glibc gcc is exactly how a "static" build acquires a silent glibc
      # dependency again.
      - name: Add musl target + C toolchain
        if: steps.want.outputs.build == 'true'
        run: |
          set -e
          rustup target add "${{ matrix.target }}"

          # Env var names the `cc` crate and cargo expect: the triple
          # uppercased with dashes as underscores (cargo linker), and the
          # triple verbatim with dashes as underscores (cc).
          TRIPLE="${{ matrix.target }}"
          CARGO_VAR="CARGO_TARGET_$(echo "$TRIPLE" | tr 'a-z-' 'A-Z_')_LINKER"
          CC_VAR="CC_$(echo "$TRIPLE" | tr '-' '_')"

          if [[ "${{ matrix.cross }}" == "true" ]]; then
            # armv7l needs a musl *cross* compiler, and Ubuntu ships none.
            #
            # musl.cc is the obvious source (deploy/lib/toolchain-c.sh already
            # falls back to it) but it is frequently unreachable or extremely
            # slow from Actions runners -- an uncapped fetch hung this job for
            # 17 minutes before being cancelled. So: try it with a hard cap,
            # then fall back to a pinned native Zig binary, which ships a
            # complete musl cross toolchain for every target.
            TC=armv7l-linux-musleabihf-cross
            if timeout 240 curl -fsSL --max-time 240 --retry 2 \
                 -o /tmp/$TC.tgz "https://musl.cc/$TC.tgz" 2>/dev/null; then
              sudo tar -xzf /tmp/$TC.tgz -C /opt
              CC_BIN=/opt/$TC/bin/armv7l-linux-musleabihf-gcc
              echo "/opt/$TC/bin" >> "$GITHUB_PATH"
              echo "armv7l C toolchain: musl.cc"
            else
              echo "musl.cc unreachable or too slow — falling back to native zig cc."
              ZIG_VERSION=0.16.0
              ZIG_DIR="/tmp/zig-x86_64-linux-$ZIG_VERSION"
              ZIG_ARCHIVE="/tmp/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
              ZIG_SHA256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
              curl -fsSL --max-time 120 --retry 2 \
                -o "$ZIG_ARCHIVE" \
                "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
              echo "$ZIG_SHA256  $ZIG_ARCHIVE" | sha256sum --check --status
              tar -xJf "$ZIG_ARCHIVE" -C /tmp
              ZIG_BIN="$ZIG_DIR/zig"
              test -x "$ZIG_BIN"
              # Keep the wrapper ephemeral: the repository does not need a
              # shell helper for this one CI-only fallback. Rust passes a GNU
              # linker workaround that Zig's lld does not accept.
              cat > /tmp/zigcc-armv7.sh <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "\${1:-}" == "-dumpmachine" && "\$#" == 1 ]]; then
              echo "arm-linux-musleabihf"
              exit 0
          fi
          args=()
          for arg in "\$@"; do
              case "\$arg" in
                  --target=*) ;;
                  -Wl,--fix-cortex-*) ;;
                  *) args+=("\$arg") ;;
              esac
          done
          exec "$ZIG_BIN" cc -target arm-linux-musleabihf "\${args[@]}"
          SH
              chmod 0755 /tmp/zigcc-armv7.sh
              CC_BIN=/tmp/zigcc-armv7.sh
              # zig links its own musl startup files, and rustc's musl targets
              # pass a self-contained crt1.o of their own -- so _start ends up
              # defined twice and ld.lld rejects the link:
              #
              #   ld.lld: error: duplicate symbol: _start
              #
              # Turning off Rust's self-contained linking for this target
              # leaves exactly one provider of crt1/crti/libc: zig.
              # (Only on the zig path -- the musl.cc gcc above is a normal
              # cross gcc and wants Rust's self-contained artifacts.)
              RUSTFLAGS_VAR="CARGO_TARGET_$(echo "$TRIPLE" | tr 'a-z-' 'A-Z_')_RUSTFLAGS"
              echo "$RUSTFLAGS_VAR=-C link-self-contained=no" >> "$GITHUB_ENV"
              echo "armv7l C toolchain: zig cc (link-self-contained=no)"
            fi
          else

            # x86_64/aarch64 build natively, so Ubuntu's own musl-gcc targets
            # the right architecture already.
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools musl-dev
            CC_BIN=musl-gcc
          fi

          {
            echo "$CARGO_VAR=$CC_BIN"
            echo "$CC_VAR=$CC_BIN"
            # protoc runs on the build host to generate code, not on the
            # target — no cross protoc needed.
            echo "PROTOC=$(command -v protoc)"
          } >> "$GITHUB_ENV"
          echo "musl toolchain for $TRIPLE: $CC_BIN"

      - name: Build
        if: steps.want.outputs.build == 'true'
        # Use Cargo.toml's complete release profile: size optimization,
        # full LTO, one codegen unit, stripping, and abort-on-panic. These
        # artifacts are the installable binaries, so CI must verify the same
        # profile a device will receive.
        run: |
          set -e
          # Always explicit now. The host triple is *-linux-gnu even on the
          # native runners, so omitting --target here is what would silently
          # produce a dynamically linked glibc binary again.
          TARGET_FLAG="--target ${{ matrix.target }}"
          LAYOUT="${{ inputs.layout }}"
          # Default for a dispatch that predates this input existing.
          [[ -n "$LAYOUT" ]] || LAYOUT=both
          want_split()    { [[ "$LAYOUT" == split    || "$LAYOUT" == both ]]; }
          want_combined() { [[ "$LAYOUT" == combined || "$LAYOUT" == both ]]; }
          build_both() { # $1 = extra cargo flags for the profile ("" or --release)
            if want_split; then
              # shellcheck disable=SC2086
              cargo build $1 --features cri -p nodelet $TARGET_FLAG
              # nodeproxy takes no features — it deliberately shares none of
              # nodelet's cri dependency tree (crates/nodeproxy/Cargo.toml).
              # Guarded for the same reason as the test job above: a ref
              # without the crate should build nodelet and say so, not fail.
              if [[ -d crates/nodeproxy ]]; then
                # shellcheck disable=SC2086
                cargo build $1 -p nodeproxy $TARGET_FLAG
              else
                echo "crates/nodeproxy not present on this ref — building nodelet only."
              fi
            # nodestore: no features either. Same guard
              # style as nodeproxy above, for the same reason: a ref that
              # predates this crate should still build the rest.
              if [[ -d crates/nodestore ]]; then
                # shellcheck disable=SC2086
                cargo build $1 -p nodestore $TARGET_FLAG
              else
                echo "crates/nodestore not present on this ref — skipping it."
              fi
              # nodescheduler: no features either — it is a pure apiserver
              # client, so there is no cri/mock split to select. Same guard,
              # same reason.
              if [[ -d crates/nodescheduler ]]; then
                # shellcheck disable=SC2086
                cargo build $1 -p nodescheduler $TARGET_FLAG
              else
                echo "crates/nodescheduler not present on this ref — skipping it."
              fi
              # nodecontroller: no features either, same reason as
              # nodescheduler above — a pure apiserver client. Same guard.
              if [[ -d crates/nodecontroller ]]; then
                # shellcheck disable=SC2086
                cargo build $1 -p nodecontroller $TARGET_FLAG
              else
                echo "crates/nodecontroller not present on this ref — skipping it."
              fi
            fi
            if [[ -d crates/nodebootstrap ]]; then
              # Standalone installer; the combined binary also exposes it as the bootstrap applet.
              # shellcheck disable=SC2086
              cargo build $1 -p nodebootstrap $TARGET_FLAG
            fi
            # The combined layout: one binary containing every component
            # (crates/notk8s), for a device that would rather not pay for a
            # second copy of the shared dependency tree.
            if want_combined; then
              if [[ -d crates/notk8s ]]; then
                # shellcheck disable=SC2086
                cargo build $1 --features cri -p notk8s $TARGET_FLAG
              else
                echo "crates/notk8s not present on this ref — no combined binary to build."
              fi
            fi
          }
          case "${{ inputs.profile }}" in
            debug)   build_both "" ;;
            release) build_both --release ;;
            both)    build_both "" ; build_both --release ;;
          esac

      - name: Stage binaries
        if: steps.want.outputs.build == 'true'
        run: |
          set -e
          # Unconditional: every arch builds with an explicit --target now, so
          # cargo always puts the output under target/<triple>/, never
          # target/<profile>/ directly.
          SRC_DIR="target/${{ matrix.target }}"
          # Keep this list in sync with the Rust component registry and the
          # combined applet table. The old deploy/components.sh source of
          # truth was removed with the shell installer tree.
          BINS=(nodelet nodeproxy nodestore nodescheduler nodecontroller nodebootstrap notk8s)
          for profile in debug release; do
            [[ -d "$SRC_DIR/$profile" ]] || continue
            for bin in "${BINS[@]}"; do
              [[ -f "$SRC_DIR/$profile/$bin" ]] || continue
              mkdir -p "dist/$profile"
              cp "$SRC_DIR/$profile/$bin" "dist/$profile/$bin"
            done
          done
          ls -laR dist
          # Size is the thing worth eyeballing after the nodeproxy split:
          # if nodeproxy isn't dramatically smaller than nodelet, its
          # dependency tree has crept back toward nodelet's and the split
          # has stopped buying anything. Same check from the other side for
          # the combined binary: it should be close to nodelet alone, not to
          # nodelet + nodeproxy, or it isn't buying anything either.
          du -h dist/*/* | sort -h

      # The property this whole change exists for, asserted rather than
      # trusted. A dependency that quietly pulls in a dynamic libc (a -sys
      # crate defaulting to pkg-config, someone dropping --target, a future
      # arch row copied from the old gnu matrix) would otherwise be invisible
      # here and only surface as "GLIBC_2.xx not found" on a user's device.
      #
      # Two independent checks, because they fail differently: an INTERP
      # segment means the kernel would hand the binary to ld.so at exec time,
      # and a NEEDED entry means it wants a shared object by name. A correct
      # static-pie musl build has neither. readelf reads any architecture, so
      # this works on the cross builds too.
      - name: Verify static linking
        if: steps.want.outputs.build == 'true'
        run: |
          set -e
          fail=0
          for f in dist/*/*; do
            [[ -f "$f" ]] || continue
            interp="$(readelf -l "$f" 2>/dev/null | grep -c INTERP || true)"
            needed="$(readelf -d "$f" 2>/dev/null | grep -c 'NEEDED' || true)"
            if [[ "$interp" != "0" || "$needed" != "0" ]]; then
              echo "NOT STATIC: $f (INTERP segments=$interp, NEEDED entries=$needed)"
              readelf -l "$f" 2>/dev/null | grep -A1 INTERP || true
              readelf -d "$f" 2>/dev/null | grep NEEDED || true
              fail=1
            else
              echo "static OK: $f"
            fi
          done
          [[ "$fail" -eq 0 ]] || {
            echo
            echo "One or more binaries are dynamically linked. They would fail"
            echo "to start on any host whose libc is older than this runner's."
            exit 1
          }

      - name: Upload debug binaries
        if: steps.want.outputs.build == 'true' && (inputs.profile == 'debug' || inputs.profile == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: notk8s-${{ matrix.arch }}-debug
          path: dist/debug/
          retention-days: 7
          if-no-files-found: error

      - name: Upload release binaries
        if: steps.want.outputs.build == 'true' && (inputs.profile == 'release' || inputs.profile == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: notk8s-${{ matrix.arch }}-release
          path: dist/release/
          retention-days: 7
          if-no-files-found: error
