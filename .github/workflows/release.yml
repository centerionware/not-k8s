name: Release pipeline

# Manual (workflow_dispatch) only — was `on: push: branches: [main]` until
# round 123, when two consecutive real pushes to main (8f1ee46, dfafc08)
# silently never queued a run at all: no run, queued or otherwise, ever
# appeared for either SHA (confirmed repeatedly via the GitHub API, well
# after any plausible indexing lag, including a follow-up empty diagnostic
# commit that *also* never triggered one). Never actually root-caused
# (nothing on the repo/workflow-file/permissions side looked wrong), so
# rather than depend on a push trigger that's demonstrated it can silently
# drop events, releases are now started by hand: push/merge to main as
# before, then trigger this workflow explicitly (`gh workflow run
# release.yml` or the Actions tab's "Run workflow" button). Still needs
# real sudo + a real k3s/containerd cluster for the e2e stage, so this
# stays independent of `pull_request` for the same reason as before: PRs
# get CodeRabbit's automated review only (.coderabbit.yaml).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Stage 1: debug build + unit tests ─────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: cargo build (debug)
        run: |
          set -e
          cargo build --features cri -p nodelet
          cargo build -p nodeproxy
          # The combined single-binary layout (crates/notk8s) links both of
          # the above into one executable. Built here purely so a break in
          # it fails this stage rather than the much later build-release
          # one — the e2e stage below still deploys the split binaries.
          cargo build --features cri -p notk8s
      # Round 124: the e2e stage's own "Build and deploy" step used to
      # redo this exact build itself, on every one of its (now 5, see
      # below) parallel shards — the same debug binary compiled 6 times
      # total (once here, 5 more downstream) for zero difference in the
      # result. Uploading it once here and downloading it in each e2e
      # shard (nodelet-build.sh's existing NOTK8S_NODELET_PREBUILT seam
      # — this was already built for exactly this, just not wired into CI
      # until now) turns that into 1 build + 5 downloads. 1-day retention:
      # only ever needed for the few minutes until every e2e shard has
      # consumed it — see the cleanup-artifact job below, which deletes it
      # outright the moment they all finish rather than waiting even that
      # long.
      - uses: actions/upload-artifact@v4
        with:
          name: nodelet-debug-binary
          path: |
            target/debug/nodelet
            target/debug/nodeproxy
          retention-days: 1
      - name: cargo test (both feature sets)
        # Under sudo: some tests (nodeproxy's svc.rs nft_check() ones) open
        # real netlink/nftables sockets to validate generated ruleset
        # syntax, which needs CAP_NET_ADMIN — consistent with this project's whole
        # premise (a kubelet replacement that manages real nftables/
        # cgroups/mounts needs root for its actual job, so its test suite
        # needing it too isn't a workaround). sudo -E preserves PATH/
        # CARGO_HOME/RUSTUP_HOME (set via $GITHUB_ENV/$GITHUB_PATH by
        # setup-toolchain) into the root shell. Confirmed for real: this
        # test failed with "cache initialization failed: Operation not
        # permitted" running unprivileged on a GitHub-hosted runner.
        run: |
          set -e
          sudo -E env "PATH=$PATH" cargo test -p nodelet
          sudo -E env "PATH=$PATH" cargo test -p nodelet --features cri
          sudo -E env "PATH=$PATH" cargo test -p nodeproxy
          sudo -E env "PATH=$PATH" cargo test -p notk8s

  # ── Stage 2: full e2e suite, real CSI + DRA reference drivers ─────────
  # Round 124: sharded 5 ways (test-e2e.sh's --shard=N/M, harness.sh's
  # _filter_shard()) — each shard is a fully independent runner/cluster
  # running its own ~1/5 slice of the registered tests concurrently,
  # turning one long serial run into 5 parallel ones. fail-fast: false so
  # one shard's real failure doesn't cancel the other 4's still-useful
  # results (matches build-release's existing per-arch matrix reasoning
  # just below). 5, not more: GitHub-hosted runner concurrency is a real,
  # shared account-wide limit, and CSI/DRA reference-driver setup is
  # per-shard fixed overhead — more shards keeps shrinking each one's own
  # test slice while that fixed cost stays constant, so returns taper off
  # well before "one shard per test" would.
  #
  # needs_drivers: true only for shards 1-2 — MUST match harness.sh's own
  # NUM_DRIVER_SHARDS constant exactly (not wired together automatically).
  # register_test's csi_dra tag (harness.sh) is round-robined only across
  # those first NUM_DRIVER_SHARDS shard indices instead of all 5, so
  # shards 3-5 never draw a CSI/DRA-dependent test at all and can skip
  # installing the reference drivers entirely — confirmed live this
  # matters: plain round-robin of all ~151 tests across all 5 shards
  # scattered even the small csi_dra set (12 tests) so thinly that every
  # single shard drew at least one, making a naive "skip if this shard
  # doesn't need it" check save nothing.
  e2e:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            needs_drivers: true
          - shard: 2
            needs_drivers: true
          - shard: 3
            needs_drivers: false
          - shard: 4
            needs_drivers: false
          - shard: 5
            needs_drivers: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nodelet-debug-binary
          path: dist-bin

      - name: Build and deploy not-k8s (real containerd/CRI runtime)
        # NOTK8S_NODELET_PREBUILT (nodelet-build.sh) skips rebuilding
        # entirely — build-and-test already built and uploaded this exact
        # binary once above; every shard just installs it.
        env:
          NOTK8S_NODELET_PREBUILT: ${{ github.workspace }}/dist-bin/nodelet
          NOTK8S_NODEPROXY_PREBUILT: ${{ github.workspace }}/dist-bin/nodeproxy
        run: |
          chmod +x "$NOTK8S_NODELET_PREBUILT" "$NOTK8S_NODEPROXY_PREBUILT"
          sudo -E ./deploy/bootstrap-source.sh --with-cri

      - name: Make the kubeconfig readable
        # Split out from "Install reference CSI + DRA drivers" (round
        # 124) — that step is now conditional on matrix.needs_drivers,
        # but EVERY shard's own test-run step still needs this
        # regardless of whether it installs the reference drivers.
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: sudo chmod 644 "$KUBECONFIG"

      - name: Install misc e2e prerequisites (hugepages, grpcurl)
        # Every shard, regardless of matrix.needs_drivers — these aren't
        # CSI/DRA-gated at all (see e2e-misc-prereqs.sh's own header).
        run: sudo -E bash deploy/lib/e2e-misc-prereqs.sh

      - name: Install reference CSI + DRA drivers
        if: matrix.needs_drivers
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          # A real containerd/nodelet on a healthy runner brings the
          # reference drivers up in well under a minute (round 121's own
          # live verification took well under that) — 3 minutes is a
          # generous ceiling, not a target, so a real regression fails
          # fast instead of silently eating the job's whole 40-minute
          # budget the way the unbounded first run did.
          sudo -E timeout 180 bash deploy/lib/e2e-full-setup.sh

      - name: Run this shard's e2e tests (${{ matrix.shard }}/5)
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
          TEST_CSI_STORAGE_CLASS: csi-hostpath-sc
          TEST_CSI_ATTACH_STORAGE_CLASS: csi-hostpath-sc
          TEST_CSI_INLINE_DRIVER: hostpath.csi.k8s.io
          TEST_CSI_BLOCK_STORAGE_CLASS: csi-hostpath-block-sc
          NOTK8S_E2E_DEBUG_ON_FAIL: "1"
          NOTK8S_E2E_MAX_FAILURES: "3"
        run: |
          # See e2e.yml's own comment on this same line for why —
          # the earlier sudo -E build step leaves ~/.kube root-owned,
          # which corrupted some tests' captured kubectl output.
          sudo chown -R "$(id -u):$(id -g)" ~/.kube 2>/dev/null || sudo rm -rf ~/.kube
          ./deploy/test-e2e.sh --shard=${{ matrix.shard }}/5

      # Runs if any earlier step in this job failed (driver setup timing
      # out, a test failing, anything) — node/taint status, disk space,
      # and nodelet's own service status + logs weren't visible anywhere
      # before this, and the CSI/DRA drivers' own upstream deploy tooling
      # only dumps *their* objects on timeout, not what's actually
      # upstream of them. See e2e-debug-dump.sh's own doc comment.
      - name: Dump debug info (node/taints/disk/nodelet logs) on failure
        if: failure()
        run: bash deploy/lib/e2e-debug-dump.sh

  # Round 124: the debug binary all 5 e2e shards downloaded above is done
  # being useful the moment every shard has finished with it, pass or
  # fail — `needs: e2e` alone would already skip this if e2e never ran,
  # but a matrix job's default `needs` gate also skips downstream jobs
  # the instant ANY shard fails, before the artifact would otherwise be
  # cleaned up; `if: always()` overrides that specifically for this
  # cleanup so it still runs. Not load-bearing (retention-days: 1 on the
  # upload already bounds the worst case) — just no reason to let it sit
  # around for its full day when this job can delete it in a few seconds.
  cleanup-nodelet-artifact:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Round 124 (found live in CI): the default GITHUB_TOKEN permissions
    # don't include actions:write, so the DELETE call below failed every
    # single run with a 403 ("Resource not accessible by integration") --
    # harmless (the artifact still expired on its own 1-day
    # retention-days), but it made this job a permanent, confusing red X
    # on an otherwise fully green pipeline. Granting it here is the real
    # fix, but org/repo-level token policies can still override a
    # workflow's own `permissions:` block and deny it anyway -- the
    # script itself also treats a permission failure as a clean skip
    # (not a job failure) so this can never turn an otherwise fully
    # green release red again, with or without the grant actually taking
    # effect.
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '.artifacts[] | select(.name=="nodelet-debug-binary") | .id')"
          if [[ -z "$artifact_id" ]]; then
            echo "no nodelet-debug-binary artifact found for this run — nothing to clean up"
            exit 0
          fi
          if ! gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"; then
            echo "couldn't delete artifact $artifact_id (likely a token-permission restriction beyond this workflow's own control) -- not fatal, it still expires on its own 1-day retention-days"
          fi

  # ── Stage 3: debug + release builds, all 3 platforms, concurrently ────
  build-release:
    needs: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, not gnu — these are the binaries actually published to
          # users, so this is the matrix where a glibc dependency does real
          # damage. A *-linux-gnu build links against the runner's glibc
          # (2.39 on ubuntu-latest) and will not start on Debian 12 (2.36),
          # Rocky 9 (2.34), openSUSE Leap 15.6 (2.38) or Alpine (no glibc),
          # which is 4 of 5 distros this was measured against. musl targets
          # set crt-static by default, so libc is linked in and nothing is
          # required from the host. Enforced by "Verify static linking".
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cross: false
          - arch: armv7l
            target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain

      # No longer armv7l-only: every arch targets musl now, and rusqlite's
      # bundled SQLite plus rustls's ring both compile C/asm, so each needs a
      # musl C compiler. Handing them the host's glibc gcc is precisely how a
      # nominally static build reacquires a glibc dependency.
      - name: Add musl target + C toolchain
        run: |
          set -e
          rustup target add "${{ matrix.target }}"
          TRIPLE="${{ matrix.target }}"
          CARGO_VAR="CARGO_TARGET_$(echo "$TRIPLE" | tr 'a-z-' 'A-Z_')_LINKER"
          CC_VAR="CC_$(echo "$TRIPLE" | tr '-' '_')"
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            # armv7l needs a musl *cross* compiler, and Ubuntu ships none.
            #
            # musl.cc is the obvious source (deploy/lib/toolchain-c.sh already
            # falls back to it) but it is frequently unreachable or extremely
            # slow from Actions runners -- an uncapped fetch hung this job for
            # 17 minutes before being cancelled. So: try it with a hard cap,
            # then fall back to zig, which ships a complete musl cross
            # toolchain for every target and installs from PyPI in seconds.
            TC=armv7l-linux-musleabihf-cross
            if timeout 240 curl -fsSL --max-time 240 --retry 2 \
                 -o /tmp/$TC.tgz "https://musl.cc/$TC.tgz" 2>/dev/null; then
              sudo tar -xzf /tmp/$TC.tgz -C /opt
              CC_BIN=/opt/$TC/bin/armv7l-linux-musleabihf-gcc
              echo "/opt/$TC/bin" >> "$GITHUB_PATH"
              echo "armv7l C toolchain: musl.cc"
            else
              echo "musl.cc unreachable or too slow — falling back to zig cc."
              python3 -m pip install --quiet --user ziglang
              # A checked-in script rather than one written inline: it has to
              # strip cc-rs's --target=<rust triple> before calling zig, and
              # that logic wants to be readable and reviewable, not escaped
              # into a printf. See the script's own header for why.
              sudo install -m 0755 .github/scripts/zigcc-armv7.sh /usr/local/bin/zigcc-armv7
              CC_BIN=/usr/local/bin/zigcc-armv7
              echo "armv7l C toolchain: zig cc"
            fi
          else

            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools musl-dev
            CC_BIN=musl-gcc
          fi
          {
            echo "$CARGO_VAR=$CC_BIN"
            echo "$CC_VAR=$CC_BIN"
            # protoc itself runs on THIS (build) host to generate code, not
            # on the target — no cross protoc needed, just make sure
            # prost-build/tonic-build find the one setup-toolchain already
            # installed regardless of target triple.
            echo "PROTOC=$(command -v protoc)"
          } >> "$GITHUB_ENV"

      - name: Build (debug + release, both profiles)
        # CARGO_PROFILE_RELEASE_LTO=thin/CODEGEN_UNITS=16 here trades a
        # bit of the smallest-possible-binary optimization Cargo.toml's
        # committed [profile.release] (lto=true, codegen-units=1) gives
        # real edge-device installs, for much faster CI turnaround — the
        # full-LTO profile's whole appeal is minimizing an edge device's
        # own resource footprint, a concern that doesn't apply to a
        # GitHub-hosted runner building the binary, only to the device
        # eventually running it. nodelet-build.sh already defines this
        # exact "lighter" preset for RAM-constrained devices
        # (release_lto_settings_for_this_device()); reused here for a
        # different reason (CI speed, not memory) but the same trade-off.
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          set -e
          # Always explicit: the host triple is *-linux-gnu even on the
          # native runners, so omitting --target is exactly what would
          # silently publish a dynamically linked glibc binary again.
          TARGET_FLAG="--target ${{ matrix.target }}"
          # shellcheck disable=SC2086
          cargo build --features cri -p nodelet $TARGET_FLAG
          # shellcheck disable=SC2086
          cargo build --release --features cri -p nodelet $TARGET_FLAG
          # nodeproxy: no features at all (see crates/nodeproxy/Cargo.toml
          # — the split exists precisely so it shares none of nodelet's
          # cri dependency tree).
          # shellcheck disable=SC2086
          cargo build -p nodeproxy $TARGET_FLAG
          # shellcheck disable=SC2086
          cargo build --release -p nodeproxy $TARGET_FLAG
          # notk8s: the combined single-binary layout — every component in
          # one executable, sharing one copy of the dependency tree they
          # have in common instead of one copy each (~12MB vs ~17MB for the
          # pair on aarch64). Published alongside the separate binaries, not
          # instead of them: bootstrap-release.sh --layout=combined fetches
          # this asset, the default still fetches the per-component ones.
          # --features cri for the same reason nodelet gets it — the
          # combined binary has to be able to do everything the separate
          # ones can.
          # shellcheck disable=SC2086
          cargo build --features cri -p notk8s $TARGET_FLAG
          # shellcheck disable=SC2086
          cargo build --release --features cri -p notk8s $TARGET_FLAG

      - name: Stage binaries for upload
        run: |
          set -e
          mkdir -p dist
          # Unconditional: every arch builds with an explicit --target now,
          # so cargo always writes under target/<triple>/.
          SRC_DIR="target/${{ matrix.target }}"
          for bin in nodelet nodeproxy notk8s; do
            cp "$SRC_DIR/debug/$bin" "dist/$bin-linux-${{ matrix.arch }}-debug"
            cp "$SRC_DIR/release/$bin" "dist/$bin-linux-${{ matrix.arch }}-release"
          done
          # Worth eyeballing on every release: the combined binary should be
          # close to nodelet's own size, not the sum of the two. If it isn't,
          # the components have stopped sharing a dependency tree and the
          # combined layout has stopped buying anything.
          du -h dist/* | sort -h

      # Asserted, not trusted — see build.yml's copy of this step for the
      # reasoning. These are the artifacts users download, so a dynamic libc
      # dependency sneaking back in here is the expensive kind of regression:
      # it looks fine in CI and fails on the user's device at exec time.
      - name: Verify static linking
        run: |
          set -e
          fail=0
          for f in dist/*; do
            [[ -f "$f" ]] || continue
            interp="$(readelf -l "$f" 2>/dev/null | grep -c INTERP || true)"
            needed="$(readelf -d "$f" 2>/dev/null | grep -c 'NEEDED' || true)"
            if [[ "$interp" != "0" || "$needed" != "0" ]]; then
              echo "NOT STATIC: $f (INTERP=$interp, NEEDED=$needed)"
              fail=1
            else
              echo "static OK: $f"
            fi
          done
          [[ "$fail" -eq 0 ]] || {
            echo "Refusing to publish dynamically linked binaries."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nodelet-${{ matrix.arch }}
          path: dist/
          retention-days: 5

  # ── Stage 4: bump version, tag, publish the GitHub Release ────────────
  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nodelet-*
          merge-multiple: true

      - name: Determine this release's version
        id: version
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="$(bash deploy/lib/version-bump.sh "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifacts to include the version
        run: |
          set -e
          cd dist
          for bin in nodelet nodeproxy notk8s; do
            for f in "$bin"-linux-*-debug "$bin"-linux-*-release; do
              [[ -f "$f" ]] || continue
              arch_profile="${f#$bin-linux-}"
              mv "$f" "$bin-${{ steps.version.outputs.version }}-linux-${arch_profile}"
            done
          done
          ls -la

      - name: Generate changelog
        run: bash deploy/lib/changelog.sh "v${{ steps.version.outputs.version }}" > changelog.md

      - name: Append the asset guide
        # A release carries three binaries per arch/profile now (nodelet,
        # nodeproxy, notk8s), which is a genuine "which one do I want?"
        # question rather than a naming detail — answer it in the release
        # body instead of making people find docs/ARCHITECTURE.md first.
        run: |
          cat > asset-guide.md <<'GUIDE'

          ---

          ## Which binaries do I want?

          Two layouts of the same components, both published here:

          - **Separate binaries** (`nodelet-…`, `nodeproxy-…`) — one per
            component. Install only what this node runs, upgrade one without
            touching the other, mix with upstream components.
          - **Combined binary** (`notk8s-…`) — every component in one
            multi-call executable that dispatches on `argv[0]`, so a
            `nodelet` symlink to it *is* nodelet. One copy of the dependency
            tree they share, which is ~30% smaller than the separate pair on
            aarch64. Same components, same processes, same services, same
            environment variables.

          The installer defaults to the separate binaries; add
          `--layout=combined` for the single one:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/centerionware/not-k8s/install-scripts/install.sh \
            | bash -s -- --with-cri --layout=combined
          ```

          `release` is the optimized build for real deployments; `debug` is
          for diagnosing something with symbols intact.
          GUIDE
          # The heredoc above is indented for readability inside the YAML;
          # strip that indentation back out so the Markdown renders as
          # Markdown and not as one long code block. Done on the guide
          # alone, never on changelog.md — changelog.sh's own output is
          # commit text this has no business reformatting.
          sed -i 's/^          //' asset-guide.md
          cat asset-guide.md >> changelog.md

      - name: Build deploy.tar.gz (what the standalone installer fetches)
        run: tar czf dist/deploy.tar.gz deploy

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file changelog.md \
            dist/nodelet-* dist/nodeproxy-* dist/notk8s-* dist/deploy.tar.gz

      - name: Compile the standalone install scripts
        run: |
          set -e
          mkdir -p install-scripts-out
          bash deploy/lib/compile-install-script.sh "${{ steps.version.outputs.version }}" install-scripts-out/install.sh
          bash deploy/lib/compile-install-script.sh "${{ steps.version.outputs.version }}" "install-scripts-out/install-v${{ steps.version.outputs.version }}.sh" --pin

      - name: Publish install scripts to the install-scripts branch
        # install.sh always gets overwritten (it's "latest" by design —
        # unpinned, resolves whatever release is newest whenever someone
        # actually runs it). install-vX.Y.Z.sh is unique per version and
        # never overwritten — older scripts stay put so a pinned install
        # keeps working exactly as it did the day it was published, even
        # after newer releases exist.
        run: |
          set -e
          BRANCH=install-scripts
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp install-scripts-out/install.sh install.sh
          cp "install-scripts-out/install-v${{ steps.version.outputs.version }}.sh" "install-v${{ steps.version.outputs.version }}.sh"
          git add install.sh "install-v${{ steps.version.outputs.version }}.sh"
          git commit -m "install scripts for v${{ steps.version.outputs.version }}" --allow-empty
          git push origin "$BRANCH"
