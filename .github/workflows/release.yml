name: Release pipeline

# Manual only: this workflow builds and publishes the Rust binaries after a
# real bootstrap-native e2e check. The standalone nodebootstrap binary is
# built once for the debug/e2e gate, then its source builder produces both
# debug and release artifacts for each target. The Rust e2e registry retains
# the former five-way layout: CSI/DRA tests use shards 1-2, and ordinary
# tests use all five shards.
on:
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Skip e2e only when a separate full e2e run already passed'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  prepare-e2e-results:
    if: ${{ !inputs.skip_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository for results reset
        uses: actions/checkout@v7

      - name: Clear the e2e-results branch for this release run
        env:
          RESULTS_BRANCH: e2e-results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$RESULTS_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cat > README.md <<EOF
          # e2e results

          - commit: $GITHUB_SHA
          - workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - started (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - release gate: true

          Each shard writes its complete output to results-shard-N.txt.
          EOF
          git add README.md
          git commit -m "e2e results: start release run ${GITHUB_SHA:0:12}"
          git push --force origin "HEAD:$RESULTS_BRANCH"

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Build the Rust bootstrapper for the unit-test stage
        run: |
          set -euo pipefail
          cargo build -p nodebootstrap
      - name: Run all unit tests
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" cargo test -p nodelet
          sudo -E env "PATH=$PATH" cargo test -p nodelet --features cri
          sudo -E env "PATH=$PATH" cargo test -p nodeproxy
          sudo -E env "PATH=$PATH" cargo test -p nodestore
          sudo -E env "PATH=$PATH" cargo test -p nodescheduler
          sudo -E env "PATH=$PATH" cargo test -p node-leaderelection
          sudo -E env "PATH=$PATH" cargo test -p nodecontroller
          sudo -E env "PATH=$PATH" cargo test -p nodeapiserver
          sudo -E env "PATH=$PATH" cargo test -p nodebootstrap
          sudo -E env "PATH=$PATH" cargo test -p notk8s
      - name: Stage the bootstrapper and combined runtime applet for e2e
        if: ${{ !inputs.skip_e2e }}
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools musl-dev linux-libc-dev
          stage="$GITHUB_WORKSPACE/e2e-source-stage"
          rm -rf "$stage" e2e-bin
          mkdir -p e2e-bin
          NODEBOOTSTRAP_ARCH=x86_64 \
          NODEBOOTSTRAP_REPO_ROOT="$GITHUB_WORKSPACE" \
          NODEBOOTSTRAP_TOOLCHAIN_DIR="$stage" \
          NODEBOOTSTRAP_SOURCE=compile \
          NOTK8S_BUILD_LAYOUT=combined \
          NOTK8S_BUILD_PROFILE=release \
            ./target/debug/nodebootstrap fetch
          install -m0755 "$stage/bin/nodebootstrap" e2e-bin/nodebootstrap
          install -m0755 "$stage/bin/notk8s" e2e-bin/notk8s
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.skip_e2e }}
        with:
          name: nodebootstrap-e2e-source-${{ github.run_id }}
          path: e2e-bin/
          # GitHub's minimum is one day; cleanup-e2e-artifact removes this
          # run-scoped artifact after the release e2e matrix consumes it.
          retention-days: 1

  plan-e2e:
    if: ${{ !inputs.skip_e2e }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: nodebootstrap-e2e-source-${{ github.run_id }}
          path: dist-bin

      - name: Plan only non-empty shards
        id: plan
        run: |
          set -euo pipefail
          chmod +x dist-bin/nodebootstrap
          matrix='{"include":[]}'
          for shard in 1 2 3 4 5; do
            selected="$(./dist-bin/nodebootstrap --e2e-list "--shard=${shard}/5")"
            if [[ -n "$selected" ]]; then
              if (( shard <= 2 )); then
                needs_drivers=true
              else
                needs_drivers=false
              fi
              matrix="$(jq -c --argjson shard "$shard" --argjson needs_drivers "$needs_drivers" \
                '.include += [{shard: $shard, needs_drivers: $needs_drivers}]' <<<"$matrix")"
            fi
          done
          echo "$matrix" | tee /tmp/release-e2e-matrix.json
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    if: ${{ !inputs.skip_e2e }}
    needs: [build-and-test, prepare-e2e-results, plan-e2e]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-e2e.outputs.matrix).include }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: nodebootstrap-e2e-source-${{ github.run_id }}
          path: dist-bin
      - name: Bootstrap a real cluster with the Rust applet
        run: |
          set -euo pipefail
          chmod +x dist-bin/nodebootstrap dist-bin/notk8s
          sudo -E env \
            NOTK8S_COMBINED_PREBUILT="$GITHUB_WORKSPACE/dist-bin/notk8s" \
            NOTK8S_BUILD_LAYOUT=combined \
            ./dist-bin/nodebootstrap \
            --layout=combined \
            --proxy=nodeproxy \
            --datastore=nodestore \
            --scheduler=nodescheduler \
            --controller-manager=nodecontroller
      - name: Make the admin kubeconfig readable
        run: sudo chmod 644 /etc/nodebootstrap/admin.kubeconfig

      - name: Reserve huge pages for e2e tests
        run: |
          set -euo pipefail
          reserved="$(cat /proc/sys/vm/nr_hugepages 2>/dev/null || echo 0)"
          if [[ "$reserved" -eq 0 ]]; then
            echo 64 | sudo tee /proc/sys/vm/nr_hugepages >/dev/null
            reserved="$(cat /proc/sys/vm/nr_hugepages)"
          fi
          if [[ "$reserved" -eq 0 ]]; then
            echo "failed to reserve huge pages for the release e2e suite" >&2
            exit 1
          fi

      - name: Install reference CSI and DRA drivers on shards 1 and 2
        if: matrix.needs_drivers
        env:
          KUBECONFIG: /etc/nodebootstrap/admin.kubeconfig
        run: |
          set -euo pipefail
          # The test cases are Rust now, but the real reference-driver
          # deployment helper remains archived with the old harness. Fetch it
          # only for the two driver shards; it is not part of the release tree.
          git fetch --no-tags --depth=1 origin archive-shell-scripts-0.7.1
          git show FETCH_HEAD:deploy/lib/e2e-full-setup.sh > /tmp/nodebootstrap-e2e-full-setup.sh
          chmod +x /tmp/nodebootstrap-e2e-full-setup.sh
          sudo -E timeout 600 bash /tmp/nodebootstrap-e2e-full-setup.sh

      - name: Run bootstrap-native e2e checks
        id: e2e
        env:
          KUBECONFIG: /etc/nodebootstrap/admin.kubeconfig
        run: |
          set +e
          if [[ "${{ matrix.needs_drivers }}" == true ]]; then
            export TEST_DRA_DEVICE_CLASS=gpu.example.com
            export TEST_CSI_STORAGE_CLASS=csi-hostpath-sc
            export TEST_CSI_ATTACH_STORAGE_CLASS=csi-hostpath-sc
            export TEST_CSI_INLINE_DRIVER=hostpath.csi.k8s.io
            export TEST_CSI_BLOCK_STORAGE_CLASS=csi-hostpath-block-sc
            export TEST_CSI_STORAGE_CLASS_WAIT=csi-hostpath-sc-wait
          fi
          ./dist-bin/nodebootstrap --e2e --shard=${{ matrix.shard }}/5 2>&1 | tee /tmp/e2e-raw.txt
          exit_code=${PIPESTATUS[0]}
          sed -r 's/\x1b\[[0-9;]*m//g' /tmp/e2e-raw.txt > /tmp/e2e-results.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate worker bootstrap without flannel or proxy
        if: matrix.shard == 5 && steps.e2e.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          sudo -E env \
            NOTK8S_COMBINED_PREBUILT="$GITHUB_WORKSPACE/dist-bin/notk8s" \
            NOTK8S_BUILD_LAYOUT=combined \
            ./dist-bin/nodebootstrap \
              --worker \
              --kubeconfig=/etc/nodebootstrap/admin.kubeconfig \
              --without-flannel \
              --proxy=none \
              --skip-nodelet
      - name: Dump all service state and logs on failure
        if: failure() || steps.e2e.outputs.exit_code != '0'
        run: |
          set +e
          export KUBECONFIG=/etc/nodebootstrap/admin.kubeconfig
          kubectl_cmd() {
            local -a kubectl_args=(--kubeconfig "$KUBECONFIG" --request-timeout=30s "$@")
            if [[ "$(id -u)" == 0 ]]; then
              kubectl "${kubectl_args[@]}"
            else
              sudo kubectl "${kubectl_args[@]}"
            fi
          }

          echo "=========================================="
          echo "all service state and logs on failure: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "=========================================="
          echo "── disk space ──"
          df -h /

          echo "── node status ──"
          kubectl_cmd get nodes -o wide
          kubectl_cmd describe nodes
          echo "── all pods (every namespace) ──"
          kubectl_cmd get pods -A -o wide
          echo "── pods not Running/Completed ──"
          kubectl_cmd get pods -A -o wide | awk 'NR==1 || ($4 !~ /Running|Completed/)'

          echo "── all installed service state and logs ──"
          mapfile -t services < <(
            {
              sudo systemctl list-units --type=service --all --no-legend --no-pager
              sudo systemctl list-unit-files --type=service --no-legend --no-pager
            } | awk '{print $1}' | sed '/^$/d' | sort -u
          )
          for unit in "${services[@]}"; do
            echo "── $unit state ──"
            sudo systemctl status "$unit" --no-pager -l || true
            echo "── $unit logs (last 300 lines) ──"
            sudo journalctl -u "$unit" --no-pager -n 300 || true
          done

          echo "── scheduler lease ──"
          kubectl_cmd get lease kube-scheduler -n kube-system -o yaml | head -30
          echo "── controller-manager lease ──"
          kubectl_cmd get lease kube-controller-manager -n kube-system -o yaml | head -30
          echo "── apiserver request/readiness signals ──"
          for api_service in nodeapiserver kube-apiserver; do
            sudo journalctl -u "$api_service.service" --no-pager -n 800 \
              | grep -iE '429|retry-after|watchlist|priority|fairness|inflight|readyz|error|failed' || true
          done
          echo "── nodecontroller volume/attach signals ──"
          sudo journalctl -u nodecontroller.service --no-pager -n 1200 \
            | grep -iE 'attachdetach|volumeattachment|persistentvolume|reconciler|csidriver|csinode|nodeipam|cidr|desiredstateofworld|actualstateofworld|populat' || true

          echo "── volumeattachments ──"
          kubectl_cmd get volumeattachments.storage.k8s.io -o wide
          echo "── csidrivers ──"
          kubectl_cmd get csidrivers.storage.k8s.io -o yaml
          echo "── csinodes ──"
          kubectl_cmd get csinodes.storage.k8s.io -o yaml
          echo "── recent events (last 100) ──"
          kubectl_cmd get events -A --sort-by=.lastTimestamp | tail -100

          echo "── controller RBAC and authorization ──"
          kubectl_cmd get clusterrole system:controller:replicaset-controller -o yaml
          kubectl_cmd get clusterrolebindings -o yaml \
            | grep -B5 -A15 'name: replicaset-controller\|controller-sa-replicaset-controller' || true
          kubectl_cmd auth can-i patch replicasets/status \
            --as=system:serviceaccount:kube-system:replicaset-controller -n kube-system
          kubectl_cmd auth can-i update replicasets/status \
            --as=system:serviceaccount:kube-system:replicaset-controller -n kube-system
          kubectl_cmd auth can-i patch endpointslices \
            --as=system:serviceaccount:kube-system:endpointslice-controller -n kube-system
          kubectl_cmd auth can-i update endpointslices \
            --as=system:serviceaccount:kube-system:endpointslice-controller -n kube-system
          kubectl_cmd get clusterrole system:controller:endpointslice-controller -o yaml
          echo "=========================================="
          echo "all service state and logs on failure: end"
          echo "=========================================="

      - name: Publish this shard's release e2e results
        if: always()
        env:
          RESULTS_BRANCH: e2e-results
          RUN_EXIT_CODE: ${{ steps.e2e.outputs.exit_code }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          {
            echo "commit: $GITHUB_SHA"
            echo "workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "shard: ${SHARD}/5"
            echo "exit code: ${RUN_EXIT_CODE:-unknown}"
            echo "release gate: true"
            echo "----------------------------------------"
            cat /tmp/e2e-results.txt 2>/dev/null || echo "(no results captured — the job failed before the Rust e2e runner started)"
          } > /tmp/e2e-results-final.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git fetch origin "$RESULTS_BRANCH"
          git checkout -B "$RESULTS_BRANCH" "origin/$RESULTS_BRANCH"
          cp /tmp/e2e-results-final.txt "results-shard-${SHARD}.txt"
          git add "results-shard-${SHARD}.txt"
          git commit -m "e2e results: release shard ${SHARD}/5 for ${GITHUB_SHA:0:12}"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$RESULTS_BRANCH"; then
              pushed=true
              break
            fi
            echo "results branch changed concurrently; rebasing (attempt $attempt)"
            git fetch origin "$RESULTS_BRANCH"
            git rebase "origin/$RESULTS_BRANCH"
            sleep $((attempt * 5))
          done
          [[ "$pushed" == true ]]

      - name: Fail the job if the e2e suite failed
        if: steps.e2e.outputs.exit_code != '0'
        run: exit 1

  cleanup-e2e-artifact:
    needs: [build-and-test, e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the run-scoped e2e source artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == ("nodebootstrap-e2e-source-" + env.GITHUB_RUN_ID)) | .id' \
            | head -n1)"
          if [[ -n "$artifact_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          fi

  build-release:
    # A skip is an explicit manual release override after a separate full e2e
    # run; unit tests still have to pass in this release run.
    if: ${{ always() && needs.build-and-test.result == 'success' && (inputs.skip_e2e || needs.e2e.result == 'success') }}
    needs: [build-and-test, e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - arch: armv7l
            target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Add musl target and C toolchain
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          triple="${{ matrix.target }}"
          cargo_var="CARGO_TARGET_$(echo "$triple" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          cc_var="CC_$(echo "$triple" | tr '-' '_')"
          if [[ "${{ matrix.cross }}" == true ]]; then
            case "${{ matrix.arch }}" in
              aarch64)
                tc=aarch64-linux-musl-cross
                cc_name=aarch64-linux-musl-gcc
                zig_target=aarch64-linux-musl
                ;;
              armv7l)
                tc=armv7l-linux-musleabihf-cross
                cc_name=armv7l-linux-musleabihf-gcc
                zig_target=arm-linux-musleabihf
                ;;
              *)
                echo "unsupported cross-build architecture: ${{ matrix.arch }}"
                exit 1
                ;;
            esac
            if timeout 240 curl -fsSL --max-time 240 --retry 2 -o "/tmp/$tc.tgz" "https://musl.cc/$tc.tgz" 2>/dev/null; then
              sudo tar -xzf "/tmp/$tc.tgz" -C /opt
              cc_bin=/opt/$tc/bin/$cc_name
              echo "/opt/$tc/bin" >> "$GITHUB_PATH"
            else
              echo "musl.cc unavailable; using the pinned native Zig fallback"
              zig_version=0.16.0
              zig_dir="/tmp/zig-x86_64-linux-$zig_version"
              zig_archive="/tmp/zig-x86_64-linux-$zig_version.tar.xz"
              zig_sha256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
              curl -fsSL --max-time 120 --retry 2 \
                -o "$zig_archive" \
                "https://ziglang.org/download/$zig_version/zig-x86_64-linux-$zig_version.tar.xz"
              echo "$zig_sha256  $zig_archive" | sha256sum --check --status
              tar -xJf "$zig_archive" -C /tmp
              zig_bin="$zig_dir/zig"
              test -x "$zig_bin"
              cat > /tmp/zigcc-musl.sh <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "\${1:-}" == "-dumpmachine" && "\$#" == 1 ]]; then
              echo "$zig_target"
              exit 0
          fi
          args=()
          for arg in "\$@"; do
              case "\$arg" in
                  # cc-rs passes Rust's full target triple, while Zig gets
                  # the normalized target from the wrapper invocation below.
                  --target=*) ;;
                  # Rust adds this GNU ld workaround for ARM targets. Zig's
                  # lld does not accept it and does not need it.
                  -Wl,--fix-cortex-*) ;;
                  *) args+=("\$arg") ;;
              esac
          done
          exec "$zig_bin" cc -target "$zig_target" "\${args[@]}"
          SH
              chmod 0755 /tmp/zigcc-musl.sh
              cc_bin=/tmp/zigcc-musl.sh
              rustflags_var="CARGO_TARGET_$(echo "$triple" | tr '[:lower:]-' '[:upper:]_')_RUSTFLAGS"
              echo "$rustflags_var=-C link-self-contained=no" >> "$GITHUB_ENV"
            fi
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools musl-dev
            cc_bin=musl-gcc
          fi
          echo "$cargo_var=$cc_bin" >> "$GITHUB_ENV"
          echo "$cc_var=$cc_bin" >> "$GITHUB_ENV"
          echo "MUSL_C_COMPILER=$cc_bin" >> "$GITHUB_ENV"
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
      - name: Build the host bootstrap builder
        run: cargo build -p nodebootstrap
      - name: Build release artifacts through nodebootstrap
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/nodebootstrap-stage" dist
          mkdir -p dist
          bins=(nodelet nodeproxy nodestore nodescheduler nodecontroller nodeapiserver nodebootstrap notk8s)
          for profile in debug release; do
            stage="$GITHUB_WORKSPACE/nodebootstrap-stage/$profile"
            mkdir -p "$stage"
            NODEBOOTSTRAP_ARCH="${{ matrix.arch }}" \
            NODEBOOTSTRAP_REPO_ROOT="$GITHUB_WORKSPACE" \
            NODEBOOTSTRAP_TOOLCHAIN_DIR="$stage" \
            NODEBOOTSTRAP_SOURCE=compile \
            NOTK8S_BUILD_LAYOUT=both \
            NOTK8S_BUILD_PROFILE="$profile" \
              ./target/debug/nodebootstrap fetch
            for bin in "${bins[@]}"; do
              cp "$stage/bin/$bin" "dist/$bin-linux-${{ matrix.arch }}-$profile"
            done
          done
      - name: Stage and verify static binaries
        run: |
          set -euo pipefail
          bins=(nodelet nodeproxy nodestore nodescheduler nodecontroller nodeapiserver nodebootstrap notk8s)
          for bin in "${bins[@]}"; do
            for profile in debug release; do
              file="dist/$bin-linux-${{ matrix.arch }}-$profile"
              [[ -f "$file" ]] || { echo "missing bootstrap-built artifact: $file"; exit 1; }
            done
          done
          failed=0
          for file in dist/*; do
            interp="$(readelf -l "$file" 2>/dev/null | grep -c INTERP || true)"
            needed="$(readelf -d "$file" 2>/dev/null | grep -c NEEDED || true)"
            if [[ "$interp" != 0 || "$needed" != 0 ]]; then
              echo "NOT STATIC: $file"
              failed=1
            fi
          done
          (( failed == 0 ))
      - uses: actions/upload-artifact@v4
        with:
          name: notk8s-${{ matrix.arch }}-${{ github.run_id }}
          path: dist/
          # GitHub's minimum is one day; cleanup-release-artifacts removes
          # these run-scoped assets after publication (normally within 15m).
          retention-days: 1

  publish-release:
    # `build-release` can intentionally run after the e2e dependency was
    # skipped by the manual skip_e2e gate. An explicit always() is required
    # here so that GitHub does not propagate that skipped ancestor into this
    # publication job; the matrix result remains the release gate.
    if: ${{ always() && needs.build-release.result == 'success' }}
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: notk8s-*-${{ github.run_id }}
          merge-multiple: true
      - name: Read the version this run publishes
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # VERSION on the `version` branch tracks the *next* release -- it's
          # only advanced after a release actually publishes (see the "Advance
          # VERSION" step below), not before. build-release's `nodebootstrap
          # fetch` already stamped the binaries in dist/ by fetching this same
          # unmodified file, so reading it again here (rather than bumping
          # first, the way this step used to) is what keeps the published
          # tag/filenames matching what's actually baked into the binaries.
          current="$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=version" --jq .content | tr -d '\n' | base64 --decode)"
          echo "version=$current" >> "$GITHUB_OUTPUT"
      - name: Rename release assets and generate notes
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bins=(nodelet nodeproxy nodestore nodescheduler nodecontroller nodeapiserver nodebootstrap notk8s)
          for bin in "${bins[@]}"; do
            for file in dist/"$bin"-linux-*; do
              [[ -f "$file" ]] || continue
              suffix="${file#dist/$bin-linux-}"
              mv "$file" "dist/$bin-$VERSION-linux-$suffix"
            done
          done
          previous="$(git tag --sort=-version:refname | head -n1 || true)"
          {
            echo "Release v$VERSION"
            echo
            if [[ -n "$previous" ]]; then
              git log --format='- %s' "$previous..HEAD"
            else
              git log -10 --format='- %s'
            fi
          } > release-notes.md
      - name: Tag and publish binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git tag "$tag"
          git push origin "$tag"
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          [[ "${#assets[@]}" -gt 0 ]]
          gh release create "$tag" --title "$tag" --notes-file release-notes.md "${assets[@]}"
      - name: Advance VERSION for the next release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Only runs once v$VERSION is actually published above -- the
          # `version` branch always names the *next* release, never this one
          # in progress. Supports both a normal MAJOR.MINOR.PATCH version and
          # a fourth, hand-added point-release component
          # (MAJOR.MINOR.PATCH.POINT, e.g. 0.7.2.1) for a hotfix that
          # shouldn't consume the next PATCH -- whichever component is last
          # gets incremented, so a 4-part current version keeps advancing its
          # 4th component instead of jumping back to a 3-part next version.
          IFS=. read -ra parts <<< "$VERSION"
          last=$(( ${#parts[@]} - 1 ))
          parts[last]=$(( parts[last] + 1 ))
          next="$(IFS=.; echo "${parts[*]}")"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=version" --jq .sha)"
          content="$(printf '%s\n' "$next" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/VERSION" \
            -f message="chore(release): advance version to $next" \
            -f content="$content" -f sha="$sha" -f branch=version >/dev/null
      - name: Update README install command to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          published_tag="$(gh release view "v$VERSION" --json tagName --jq .tagName)"
          published_version="${published_tag#v}"
          [[ "$published_version" == "$VERSION" ]]

          old_version="$(sed -nE 's#^wget https://github.com/centerionware/not-k8s/releases/download/v([0-9]+(\.[0-9]+)+)/notk8s-[0-9]+(\.[0-9]+)+-linux-aarch64-release$#\1#p' README.md | head -n1)"
          [[ -n "$old_version" ]]
          if [[ "$old_version" == "$published_version" ]]; then
            echo "README already points at release $published_version"
            exit 0
          fi

          OLD_VERSION="$old_version" NEW_VERSION="$published_version" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          old = os.environ["OLD_VERSION"]
          new = os.environ["NEW_VERSION"]
          pattern = re.compile(
              rf"(wget https://github\.com/centerionware/not-k8s/releases/download/v)"
              rf"{re.escape(old)}(/notk8s-){re.escape(old)}"
              rf"(-linux-aarch64-release)"
          )
          updated, replacements = pattern.subn(
              lambda match: f"{match.group(1)}{new}{match.group(2)}{new}{match.group(3)}",
              text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit(
                  f"expected one README install command for release {old}, found {replacements}"
              )
          path.write_text(updated)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README install version to $published_version"

          branch="$GITHUB_REF_NAME"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$branch"; then
              pushed=true
              break
            fi
            echo "branch changed concurrently; rebasing (attempt $attempt)"
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep $((attempt * 5))
          done
          [[ "$pushed" == true ]]

  cleanup-release-artifacts:
    needs: [build-release, publish-release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete run-scoped release build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("notk8s-")) | .id' \
            | while read -r artifact_id; do
                [[ -z "$artifact_id" ]] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              done
