name: Release pipeline

# Manual only: this workflow builds and publishes the Rust binaries after a
# real bootstrap-native e2e check. The standalone nodebootstrap binary is
# built once for the debug/e2e gate, then its source builder produces the
# release-profile artifacts for each target. The Rust e2e registry retains
# the former five-way layout: CSI/DRA tests use shards 1-2, and ordinary
# tests use all five shards.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  prepare-e2e-results:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository for results reset
        uses: actions/checkout@v7

      - name: Clear the e2e-results branch for this release run
        env:
          RESULTS_BRANCH: e2e-results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$RESULTS_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cat > README.md <<EOF
          # e2e results

          - commit: $GITHUB_SHA
          - workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - started (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - release gate: true

          Each shard writes its complete output to results-shard-N.txt.
          EOF
          git add README.md
          git commit -m "e2e results: start release run ${GITHUB_SHA:0:12}"
          git push --force origin "HEAD:$RESULTS_BRANCH"

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Build the Rust bootstrapper and combined debug runtime applet
        run: |
          set -euo pipefail
          cargo build -p nodebootstrap
          cargo build --features cri -p notk8s
      - name: Run all unit tests
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" cargo test -p nodelet
          sudo -E env "PATH=$PATH" cargo test -p nodelet --features cri
          sudo -E env "PATH=$PATH" cargo test -p nodeproxy
          sudo -E env "PATH=$PATH" cargo test -p nodestore
          sudo -E env "PATH=$PATH" cargo test -p nodescheduler
          sudo -E env "PATH=$PATH" cargo test -p node-leaderelection
          sudo -E env "PATH=$PATH" cargo test -p nodecontroller
          sudo -E env "PATH=$PATH" cargo test -p nodebootstrap
          sudo -E env "PATH=$PATH" cargo test -p notk8s
      - name: Stage the bootstrapper and combined runtime applet for e2e
        run: |
          set -euo pipefail
          mkdir -p e2e-bin
          install -m0755 target/debug/nodebootstrap e2e-bin/nodebootstrap
          install -m0755 target/debug/notk8s e2e-bin/notk8s
      - uses: actions/upload-artifact@v4
        with:
          name: nodebootstrap-e2e-binaries
          path: e2e-bin/
          retention-days: 1

  e2e:
    needs: [build-and-test, prepare-e2e-results]
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            needs_drivers: true
          - shard: 2
            needs_drivers: true
          - shard: 3
            needs_drivers: false
          - shard: 4
            needs_drivers: false
          - shard: 5
            needs_drivers: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: nodebootstrap-e2e-binaries
          path: dist-bin
      - name: Bootstrap a real cluster with the Rust applet
        run: |
          set -euo pipefail
          chmod +x dist-bin/nodebootstrap dist-bin/notk8s
          sudo -E env \
            NOTK8S_COMBINED_PREBUILT="$GITHUB_WORKSPACE/dist-bin/notk8s" \
            NOTK8S_BUILD_LAYOUT=combined \
            ./dist-bin/nodebootstrap \
            --layout=combined \
            --proxy=nodeproxy \
            --datastore=nodestore \
            --scheduler=nodescheduler \
            --controller-manager=nodecontroller
      - name: Make the admin kubeconfig readable
        run: sudo chmod 644 /etc/nodebootstrap/admin.kubeconfig
      - name: Run bootstrap-native e2e checks
        id: e2e
        env:
          KUBECONFIG: /etc/nodebootstrap/admin.kubeconfig
        run: |
          set +e
          ./dist-bin/nodebootstrap --e2e --shard=${{ matrix.shard }}/5 2>&1 | tee /tmp/e2e-raw.txt
          exit_code=${PIPESTATUS[0]}
          sed -r 's/\x1b\[[0-9;]*m//g' /tmp/e2e-raw.txt > /tmp/e2e-results.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate worker bootstrap without flannel or proxy
        run: |
          set -euo pipefail
          sudo -E env \
            NOTK8S_COMBINED_PREBUILT="$GITHUB_WORKSPACE/dist-bin/notk8s" \
            NOTK8S_BUILD_LAYOUT=combined \
            ./dist-bin/nodebootstrap \
              --worker \
              --kubeconfig=/etc/nodebootstrap/admin.kubeconfig \
              --without-flannel \
              --proxy=none \
              --skip-nodelet
      - name: Dump bootstrap service state on failure
        if: failure() || steps.e2e.outputs.exit_code != '0'
        run: |
          sudo systemctl --no-pager --full status kube-apiserver nodestore nodelet nodeproxy nodescheduler nodecontroller flanneld || true
          for unit in kube-apiserver nodestore nodelet nodeproxy nodescheduler nodecontroller flanneld; do
            sudo journalctl -u "$unit" -n 80 --no-pager || true
          done

      - name: Publish this shard's release e2e results
        if: always()
        env:
          RESULTS_BRANCH: e2e-results
          RUN_EXIT_CODE: ${{ steps.e2e.outputs.exit_code }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          {
            echo "commit: $GITHUB_SHA"
            echo "workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "shard: ${SHARD}/5"
            echo "exit code: ${RUN_EXIT_CODE:-unknown}"
            echo "release gate: true"
            echo "----------------------------------------"
            cat /tmp/e2e-results.txt 2>/dev/null || echo "(no results captured — the job failed before the Rust e2e runner started)"
          } > /tmp/e2e-results-final.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git fetch origin "$RESULTS_BRANCH"
          git checkout -B "$RESULTS_BRANCH" "origin/$RESULTS_BRANCH"
          cp /tmp/e2e-results-final.txt "results-shard-${SHARD}.txt"
          git add "results-shard-${SHARD}.txt"
          git commit -m "e2e results: release shard ${SHARD}/5 for ${GITHUB_SHA:0:12}"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$RESULTS_BRANCH"; then
              pushed=true
              break
            fi
            echo "results branch changed concurrently; rebasing (attempt $attempt)"
            git fetch origin "$RESULTS_BRANCH"
            git rebase "origin/$RESULTS_BRANCH"
            sleep $((attempt * 5))
          done
          [[ "$pushed" == true ]]

      - name: Fail the job if the e2e suite failed
        if: steps.e2e.outputs.exit_code != '0'
        run: exit 1

  build-release:
    needs: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cross: false
          - arch: armv7l
            target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Add musl target and C toolchain
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          triple="${{ matrix.target }}"
          cargo_var="CARGO_TARGET_$(echo "$triple" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          cc_var="CC_$(echo "$triple" | tr '-' '_')"
          if [[ "${{ matrix.cross }}" == true ]]; then
            tc=armv7l-linux-musleabihf-cross
            if timeout 240 curl -fsSL --max-time 240 --retry 2 -o "/tmp/$tc.tgz" "https://musl.cc/$tc.tgz" 2>/dev/null; then
              sudo tar -xzf "/tmp/$tc.tgz" -C /opt
              cc_bin=/opt/$tc/bin/armv7l-linux-musleabihf-gcc
              echo "/opt/$tc/bin" >> "$GITHUB_PATH"
            else
              python3 -m pip install --quiet --user ziglang
              cat > /tmp/zigcc-armv7.py <<'PY'
              import os
              import sys
              args = [arg for arg in sys.argv[1:] if not arg.startswith("--target=")]
              os.execvp("python3", ["python3", "-m", "ziglang", "cc", "-target", "arm-linux-musleabihf", *args])
              PY
              chmod 0755 /tmp/zigcc-armv7.py
              cc_bin=/tmp/zigcc-armv7.py
              rustflags_var="CARGO_TARGET_$(echo "$triple" | tr '[:lower:]-' '[:upper:]_')_RUSTFLAGS"
              echo "$rustflags_var=-C link-self-contained=no" >> "$GITHUB_ENV"
            fi
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools musl-dev
            cc_bin=musl-gcc
          fi
          echo "$cargo_var=$cc_bin" >> "$GITHUB_ENV"
          echo "$cc_var=$cc_bin" >> "$GITHUB_ENV"
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
      - name: Build the host bootstrap builder
        run: cargo build -p nodebootstrap
      - name: Build release artifacts through nodebootstrap
        run: |
          set -euo pipefail
          target="--target=${{ matrix.target }}"
          stage="$GITHUB_WORKSPACE/nodebootstrap-stage"
          mkdir -p "$stage"
          NODEBOOTSTRAP_ARCH="${{ matrix.arch }}" \
          NODEBOOTSTRAP_REPO_ROOT="$GITHUB_WORKSPACE" \
          NODEBOOTSTRAP_TOOLCHAIN_DIR="$stage" \
          NODEBOOTSTRAP_SOURCE=compile \
          NOTK8S_BUILD_LAYOUT=both \
            ./target/debug/nodebootstrap fetch

          # Keep debug artifacts for diagnostics and the existing release
          # asset contract. The optimized release artifacts above are built
          # and staged by nodebootstrap's own source-build path.
          bins=(nodelet nodeproxy nodestore nodescheduler nodecontroller nodebootstrap notk8s)
          for bin in "${bins[@]}"; do
            case "$bin" in
              nodelet|notk8s) cargo build --features cri -p "$bin" "$target" ;;
              *) cargo build -p "$bin" "$target" ;;
            esac
          done
      - name: Stage and verify static binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          bins=(nodelet nodeproxy nodestore nodescheduler nodecontroller nodebootstrap notk8s)
          for bin in "${bins[@]}"; do
            cp "target/${{ matrix.target }}/debug/$bin" "dist/$bin-linux-${{ matrix.arch }}-debug"
            cp "$GITHUB_WORKSPACE/nodebootstrap-stage/bin/$bin" "dist/$bin-linux-${{ matrix.arch }}-release"
          done
          failed=0
          for file in dist/*; do
            interp="$(readelf -l "$file" 2>/dev/null | grep -c INTERP || true)"
            needed="$(readelf -d "$file" 2>/dev/null | grep -c NEEDED || true)"
            if [[ "$interp" != 0 || "$needed" != 0 ]]; then
              echo "NOT STATIC: $file"
              failed=1
            fi
          done
          (( failed == 0 ))
      - uses: actions/upload-artifact@v4
        with:
          name: notk8s-${{ matrix.arch }}
          path: dist/
          retention-days: 5

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: notk8s-*
          merge-multiple: true
      - name: Determine and record the next release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=version" --jq .content | tr -d '\n' | base64 --decode)"
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=version" --jq .sha)"
          content="$(printf '%s\n' "$next" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/VERSION" \
            -f message="chore(release): advance version to $next" \
            -f content="$content" -f sha="$sha" -f branch=version >/dev/null
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Rename release assets and generate notes
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bins=(nodelet nodeproxy nodestore nodescheduler nodecontroller nodebootstrap notk8s)
          for bin in "${bins[@]}"; do
            for file in dist/"$bin"-linux-*; do
              [[ -f "$file" ]] || continue
              suffix="${file#dist/$bin-linux-}"
              mv "$file" "dist/$bin-$VERSION-linux-$suffix"
            done
          done
          previous="$(git tag --sort=-version:refname | head -n1 || true)"
          {
            echo "Release v$VERSION"
            echo
            if [[ -n "$previous" ]]; then
              git log --format='- %s' "$previous..HEAD"
            else
              git log -10 --format='- %s'
            fi
          } > release-notes.md
      - name: Tag and publish binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git tag "$tag"
          git push origin "$tag"
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          [[ "${#assets[@]}" -gt 0 ]]
          gh release create "$tag" --title "$tag" --notes-file release-notes.md "${assets[@]}"
