name: Release pipeline

# Publication follows unit tests and static release builds. Validation then
# downloads the exact published assets; no workflow dispatch/reusable workflows.
on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize release/version mutation. Validation jobs within a run remain parallel.
concurrency:
  group: not-k8s-release
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1

jobs:
  release-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Freeze version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=version" --jq .content | tr -d '\n' | base64 --decode)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]] || exit 2
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Build bootstrap
        run: |
          set -euo pipefail
          cargo build -p nodebootstrap
      - name: Run all unit tests
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" cargo test -p nodelet
          sudo -E env "PATH=$PATH" cargo test -p nodelet --features cri
          sudo -E env "PATH=$PATH" cargo test -p nodeproxy
          sudo -E env "PATH=$PATH" cargo test -p nodestore
          sudo -E env "PATH=$PATH" cargo test -p nodescheduler
          sudo -E env "PATH=$PATH" cargo test -p node-leaderelection
          sudo -E env "PATH=$PATH" cargo test -p nodecontroller
          sudo -E env "PATH=$PATH" cargo test -p nodeapiserver
          sudo -E env "PATH=$PATH" cargo test -p nodebootstrap
          sudo -E env "PATH=$PATH" cargo test -p notk8s
  build-release:
    needs: [build-and-test, release-identity]
    env:
      RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - arch: armv7l
            target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Prepare musl
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          triple="${{ matrix.target }}"
          cargo_var="CARGO_TARGET_$(echo "$triple" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          cc_var="CC_$(echo "$triple" | tr '-' '_')"
          if [[ "${{ matrix.cross }}" == true ]]; then
            case "${{ matrix.arch }}" in
              aarch64)
                tc=aarch64-linux-musl-cross
                cc_name=aarch64-linux-musl-gcc
                zig_target=aarch64-linux-musl
                ;;
              armv7l)
                tc=armv7l-linux-musleabihf-cross
                cc_name=armv7l-linux-musleabihf-gcc
                zig_target=arm-linux-musleabihf
                ;;
              *)
                echo "unsupported cross-build architecture: ${{ matrix.arch }}"
                exit 1
                ;;
            esac
            if timeout 240 curl -fsSL --max-time 240 --retry 2 -o "/tmp/$tc.tgz" "https://musl.cc/$tc.tgz" 2>/dev/null; then
              sudo tar -xzf "/tmp/$tc.tgz" -C /opt
              cc_bin=/opt/$tc/bin/$cc_name
              echo "/opt/$tc/bin" >> "$GITHUB_PATH"
            else
              echo "musl.cc unavailable; using the pinned native Zig fallback"
              zig_version=0.16.0
              zig_dir="/tmp/zig-x86_64-linux-$zig_version"
              zig_archive="/tmp/zig-x86_64-linux-$zig_version.tar.xz"
              zig_sha256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
              curl -fsSL --max-time 120 --retry 2 \
                -o "$zig_archive" \
                "https://ziglang.org/download/$zig_version/zig-x86_64-linux-$zig_version.tar.xz"
              echo "$zig_sha256  $zig_archive" | sha256sum --check --status
              tar -xJf "$zig_archive" -C /tmp
              zig_bin="$zig_dir/zig"
              test -x "$zig_bin"
              cat > /tmp/zigcc-musl.sh <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "\${1:-}" == "-dumpmachine" && "\$#" == 1 ]]; then
              echo "$zig_target"
              exit 0
          fi
          args=()
          for arg in "\$@"; do
              case "\$arg" in
                  # cc-rs passes Rust's full target triple, while Zig gets
                  # the normalized target from the wrapper invocation below.
                  --target=*) ;;
                  # Rust adds this GNU ld workaround for ARM targets. Zig's
                  # lld does not accept it and does not need it.
                  -Wl,--fix-cortex-*) ;;
                  *) args+=("\$arg") ;;
              esac
          done
          exec "$zig_bin" cc -target "$zig_target" "\${args[@]}"
          SH
              chmod 0755 /tmp/zigcc-musl.sh
              cc_bin=/tmp/zigcc-musl.sh
              rustflags_var="CARGO_TARGET_$(echo "$triple" | tr '[:lower:]-' '[:upper:]_')_RUSTFLAGS"
              echo "$rustflags_var=-C link-self-contained=no" >> "$GITHUB_ENV"
            fi
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools musl-dev
            cc_bin=musl-gcc
          fi
          echo "$cargo_var=$cc_bin" >> "$GITHUB_ENV"
          echo "$cc_var=$cc_bin" >> "$GITHUB_ENV"
          echo "MUSL_C_COMPILER=$cc_bin" >> "$GITHUB_ENV"
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
      - name: Build bootstrap
        run: cargo build -p nodebootstrap
      - name: Build release assets
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/nodebootstrap-stage" dist
          mkdir -p dist
          bins=(nodelet nodeproxy nodestore nodescheduler nodecontroller nodeapiserver nodebootstrap notk8s)
          for profile in debug release; do
            stage="$GITHUB_WORKSPACE/nodebootstrap-stage/$profile"
            mkdir -p "$stage"
            NODEBOOTSTRAP_ARCH="${{ matrix.arch }}" \
            NODEBOOTSTRAP_REPO_ROOT="$GITHUB_WORKSPACE" \
            NODEBOOTSTRAP_TOOLCHAIN_DIR="$stage" \
            NODEBOOTSTRAP_SOURCE=compile \
            NOTK8S_BUILD_LAYOUT=both \
            NOTK8S_BUILD_PROFILE="$profile" \
              ./target/debug/nodebootstrap fetch
            for bin in "${bins[@]}"; do
              cp "$stage/bin/$bin" "dist/$bin-linux-${{ matrix.arch }}-$profile"
            done
          done
      - name: Check asset version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as stream:
              actual = tomllib.load(stream)['workspace']['package']['version']
          assert actual == os.environ['RELEASE_VERSION'], (actual, os.environ['RELEASE_VERSION'])
          PY
      - name: Build profile asset
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          RUSTFLAGS='-C force-frame-pointers=yes' cargo build --profile profiling --features cri -p notk8s --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/profiling/notk8s dist/notk8s-linux-x86_64-profiling
          readelf -SW dist/notk8s-linux-x86_64-profiling > /tmp/profiling-sections.txt
          grep -q '\.debug_info' /tmp/profiling-sections.txt
          grep -q '\.symtab' /tmp/profiling-sections.txt
      - name: Verify static assets
        run: |
          set -euo pipefail
          bins=(nodelet nodeproxy nodestore nodescheduler nodecontroller nodeapiserver nodebootstrap notk8s)
          for bin in "${bins[@]}"; do
            for profile in debug release; do
              file="dist/$bin-linux-${{ matrix.arch }}-$profile"
              [[ -f "$file" ]] || { echo "missing bootstrap-built artifact: $file"; exit 1; }
            done
          done
          failed=0
          for file in dist/*; do
            interp="$(readelf -l "$file" 2>/dev/null | grep -c INTERP || true)"
            needed="$(readelf -d "$file" 2>/dev/null | grep -c NEEDED || true)"
            if [[ "$interp" != 0 || "$needed" != 0 ]]; then
              echo "NOT STATIC: $file"
              failed=1
            fi
          done
          (( failed == 0 ))
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notk8s-${{ matrix.arch }}-${{ github.run_id }}
          path: dist/
          # GitHub's minimum is one day; cleanup-release-artifacts removes
          # these run-scoped assets after publication (normally within 15m).
          retention-days: 1

  publish-release:
    outputs:
      tag: v${{ steps.version.outputs.version }}
      published: ${{ steps.publish.outputs.published }}
    needs: [build-release, release-identity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: notk8s-*-${{ github.run_id }}
          merge-multiple: true
      - name: Read frozen version
        id: version
        env:
          RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
        run: echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bins=(nodelet nodeproxy nodestore nodescheduler nodecontroller nodeapiserver nodebootstrap notk8s)
          for bin in "${bins[@]}"; do
            for file in dist/"$bin"-linux-*; do
              [[ -f "$file" ]] || continue
              suffix="${file#dist/$bin-linux-}"
              mv "$file" "dist/$bin-$VERSION-linux-$suffix"
            done
          done
          previous="$(git tag --sort=-version:refname | head -n1 || true)"
          {
            echo "[E2e and profiling results](https://github.com/$GITHUB_REPOSITORY/tree/e2e-prof-v$VERSION)"
            echo
            echo "Post-publication validation runs automatically; inspect its status before relying on this release."
            echo
            echo "Release v$VERSION"
            echo
            if [[ -n "$previous" ]]; then
              git log --format='- %s' "$previous..HEAD"
            else
              git log -10 --format='- %s'
            fi
          } > release-notes.md
      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git tag "$tag"
          git push origin "$tag"
          (cd dist && sha256sum * > SHA256SUMS)
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          [[ "${#assets[@]}" -gt 0 ]]
          gh release create "$tag" --title "$tag" --notes-file release-notes.md "${assets[@]}"
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Advance VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Only runs once v$VERSION is actually published above -- the
          # `version` branch always names the *next* release, never this one
          # in progress. Supports both a normal MAJOR.MINOR.PATCH version and
          # a fourth, hand-added point-release component
          # (MAJOR.MINOR.PATCH.POINT, e.g. 0.7.2.1) for a hotfix that
          # shouldn't consume the next PATCH -- whichever component is last
          # gets incremented, so a 4-part current version keeps advancing its
          # 4th component instead of jumping back to a 3-part next version.
          IFS=. read -ra parts <<< "$VERSION"
          last=$(( ${#parts[@]} - 1 ))
          parts[last]=$(( parts[last] + 1 ))
          next="$(IFS=.; echo "${parts[*]}")"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=version" --jq .sha)"
          content="$(printf '%s\n' "$next" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/VERSION" \
            -f message="chore(release): advance version to $next" \
            -f content="$content" -f sha="$sha" -f branch=version >/dev/null
      - name: Update install docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          published_tag="$(gh release view "v$VERSION" --json tagName --jq .tagName)"
          published_version="${published_tag#v}"
          [[ "$published_version" == "$VERSION" ]]

          old_version="$(sed -nE 's#^wget https://github.com/centerionware/not-k8s/releases/download/v([0-9]+(\.[0-9]+)+)/notk8s-[0-9]+(\.[0-9]+)+-linux-aarch64-release$#\1#p' README.md | head -n1)"
          [[ -n "$old_version" ]]
          if [[ "$old_version" == "$published_version" ]]; then
            echo "README already points at release $published_version"
            exit 0
          fi

          OLD_VERSION="$old_version" NEW_VERSION="$published_version" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          old = os.environ["OLD_VERSION"]
          new = os.environ["NEW_VERSION"]
          pattern = re.compile(
              rf"(wget https://github\.com/centerionware/not-k8s/releases/download/v)"
              rf"{re.escape(old)}(/notk8s-){re.escape(old)}"
              rf"(-linux-aarch64-release)"
          )
          updated, replacements = pattern.subn(
              lambda match: f"{match.group(1)}{new}{match.group(2)}{new}{match.group(3)}",
              text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit(
                  f"expected one README install command for release {old}, found {replacements}"
              )
          path.write_text(updated)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README install version to $published_version"

          branch="$GITHUB_REF_NAME"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$branch"; then
              pushed=true
              break
            fi
            echo "branch changed concurrently; rebasing (attempt $attempt)"
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep $((attempt * 5))
          done
          [[ "$pushed" == true ]]

  cleanup-release-artifacts:
    needs: [build-release, publish-release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("notk8s-")) | .id' \
            | while read -r artifact_id; do
                [[ -z "$artifact_id" ]] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              done

  prepare-validation:
    needs: publish-release
    if: ${{ always() && needs.publish-release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      branch: ${{ steps.identity.outputs.branch }}
    env:
      RELEASE_TAG: ${{ needs.publish-release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-release.outputs.tag }}
          persist-credentials: false
      - name: Create results index
        id: identity
        run: |
          set -euo pipefail
          branch="e2e-prof-$RELEASE_TAG"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          payload=$(mktemp -d)
          cat > "$payload/README.md" <<EOF
          # $RELEASE_TAG validation

          **Status: running. Publication is not a validation pass.**

          - [Published release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)
          - [Workflow and job status](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - Source: $GITHUB_SHA
          - [E2e shards](e2e/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/)
          - [Latest stack flamegraphs](latest-stack.md)
          - [Latest three-way comparison](latest-comparison.md)

          Heavy workload, 300 seconds idle and 300 seconds load per profile.
          E2e and metrics use the published release binary. Flamegraphs use the
          additional published optimized symbolized diagnostic binary, not a
          release-performance ratio. Failed/partial captures are not passes.
          EOF
          bash deploy/publish-validation-results.sh "$payload" "$branch"
      - name: Get release runtime
        run: bash deploy/download-release-runtime.sh "$RELEASE_TAG" release "$GITHUB_WORKSPACE/dist-bin"
      - name: Plan e2e shards
        id: plan
        run: |
          set -euo pipefail
          matrix='{"include":[]}'
          for shard in 1 2 3 4 5; do
            selected="$(./dist-bin/notk8s nodebootstrap --e2e-list "--shard=$shard/5")"
            [[ -n "$selected" ]] || { echo "unexpected empty release shard $shard" >&2; exit 1; }
            drivers="$(./dist-bin/notk8s nodebootstrap --e2e-needs-drivers "--shard=$shard/5")"
            [[ "$drivers" == true || "$drivers" == false ]] || exit 1
            matrix="$(jq -c --argjson shard "$shard" --argjson drivers "$drivers" '.include += [{shard:$shard, needs_drivers:$drivers}]' <<< "$matrix")"
          done
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  release-e2e:
    needs: [publish-release, prepare-validation]
    if: ${{ always() && needs.prepare-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-validation.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.publish-release.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-release.outputs.tag }}
          persist-credentials: false
      - name: Get release runtime
        run: bash deploy/download-release-runtime.sh "$RELEASE_TAG" release "$GITHUB_WORKSPACE/dist-bin"
      - name: Run e2e shard
        uses: ./.github/actions/e2e-run
        with:
          shard: ${{ matrix.shard }}
          needs_drivers: ${{ matrix.needs_drivers }}
          apiserver: nodeapiserver
          results_branch: ${{ needs.prepare-validation.outputs.branch }}
          results_prefix: e2e/${{ github.run_id }}-${{ github.run_attempt }}

  release-flamegraphs:
    needs: [publish-release, prepare-validation]
    if: ${{ always() && needs.prepare-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROFILE_BUILD: profiling
      RUSTFLAGS: '-C force-frame-pointers=yes'
      PROFILE_SECONDS: '300'
      PROFILE_WORKLOAD: heavy
      PROFILE_ARCHIVE_LIMIT_MIB: '1024'
      PROFILE_RESULTS_BRANCH: ${{ needs.prepare-validation.outputs.branch }}
      KUBECONFIG: /etc/nodebootstrap/admin.kubeconfig
      FLAMEGRAPH_DIR: ${{ github.workspace }}/.bootstrap/flamegraph-tools
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-release.outputs.tag }}
          persist-credentials: false
      - name: Stack flamegraphs
        uses: ./.github/actions/profile-stack-run
        with:
          release_tag: ${{ needs.publish-release.outputs.tag }}

  release-comparison:
    needs: [publish-release, prepare-validation]
    if: ${{ always() && needs.prepare-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [notk8s, k8s, k3s]
    env:
      PROFILE_DISPOSABLE_RUNNER: '1'
      PROFILE_SECONDS: '300'
      PROFILE_WORKLOAD: heavy
      PROFILE_COMPONENTS: nodestore,nodeapiserver,nodescheduler,nodecontroller,nodelet,nodeproxy
      PROFILE_WHOLE: 'true'
      PROFILE_BACKEND: ${{ matrix.backend }}
      PROFILE_K3S_VERSION: latest
      PROFILE_K8S_VERSION: latest
      PROFILE_RESULTS_BRANCH: ${{ needs.prepare-validation.outputs.branch }}
      KUBECONFIG: /etc/nodebootstrap/admin.kubeconfig
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-release.outputs.tag }}
          persist-credentials: false
      - name: Measure comparison
        uses: ./.github/actions/profile-compare-leg
        with:
          release_tag: ${{ needs.publish-release.outputs.tag }}

  release-comparison-report:
    needs: [publish-release, prepare-validation, release-comparison]
    if: ${{ always() && needs.release-comparison.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PROFILE_RESULTS_BRANCH: ${{ needs.prepare-validation.outputs.branch }}
      PROFILE_BACKENDS: '["notk8s","k8s","k3s"]'
      PROFILE_COMPONENTS: nodestore,nodeapiserver,nodescheduler,nodecontroller,nodelet,nodeproxy
      PROFILE_WHOLE: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-release.outputs.tag }}
          persist-credentials: false
      - name: Render comparison
        uses: ./.github/actions/profile-compare-report

  validation-summary:
    needs: [publish-release, prepare-validation, release-e2e, release-flamegraphs, release-comparison, release-comparison-report]
    if: ${{ always() && needs.publish-release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.publish-release.outputs.tag }}
      VALIDATION_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-release.outputs.tag }}
          persist-credentials: false
      - name: Write final status
        run: python3 deploy/release-validation-summary.py
      - name: Publish final index
        if: always()
        run: bash deploy/publish-validation-results.sh validation-summary "e2e-prof-$RELEASE_TAG"
      - name: Check validation
        run: test "$(cat validation-summary/conclusion.txt)" = success
