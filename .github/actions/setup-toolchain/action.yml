name: Setup toolchain
description: Installs the CI Rust toolchain and protobuf compiler without the removed shell installer tree.

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install protoc
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v protoc >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
        fi
        protoc --version
