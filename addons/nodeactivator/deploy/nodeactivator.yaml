apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodeactivator
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nodeactivator-services
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nodeactivator-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nodeactivator-services
subjects:
- kind: ServiceAccount
  name: nodeactivator
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodeactivator-cert-signer
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nodeactivator-cert-signer
  namespace: kube-system
rules:
- apiGroups: ["certificates.k8s.io"]
  resources: ["podcertificaterequests", "podcertificaterequests/status"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: [""]
  resources: ["pods", "services", "serviceaccounts"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nodeactivator-cert-signer-nodes
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nodeactivator-cert-signer
rules:
- apiGroups: ["certificates.k8s.io"]
  resources: ["signers"]
  resourceNames: ["nodeactivator.notk8s.io/serving"]
  verbs: ["sign"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nodeactivator-cert-signer-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nodeactivator-cert-signer-nodes
subjects:
- kind: ServiceAccount
  name: nodeactivator-cert-signer
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nodeactivator-cert-signer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nodeactivator-cert-signer
subjects:
- kind: ServiceAccount
  name: nodeactivator-cert-signer
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nodeactivator-cert-signer
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nodeactivator-cert-signer
subjects:
- kind: ServiceAccount
  name: nodeactivator-cert-signer
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeactivator-cert-signer
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nodeactivator-cert-signer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodeactivator-cert-signer
    spec:
      serviceAccountName: nodeactivator-cert-signer
      containers:
      - name: signer
        image: nodeactivator:latest
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/nodeactivator-cert-signer"]
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODEACTIVATOR_SIGNER_CA_CERT
          value: /var/run/nodeactivator-signer/ca.crt
        - name: NODEACTIVATOR_SIGNER_CA_KEY
          value: /var/run/nodeactivator-signer/ca.key
        volumeMounts:
        - name: signer-ca
          mountPath: /var/run/nodeactivator-signer
          readOnly: true
      volumes:
      - name: signer-ca
        secret:
          secretName: nodeactivator-signer-ca
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nodeactivator-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: nodeactivator
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeactivator
  namespace: kube-system
  labels:
    app.kubernetes.io/name: nodeactivator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nodeactivator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodeactivator
    spec:
      serviceAccountName: nodeactivator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nodeactivator
        image: nodeactivator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: metrics-https
          containerPort: 8443
        env:
        - name: ACTIVATOR_TLS_BUNDLE
          value: /var/run/nodeactivator/tls/credential.pem
        - name: ACTIVATOR_PROXY_CLIENT_CA
          value: /var/run/nodeactivator/proxy-ca/ca.crt
        - name: ACTIVATOR_TIMEOUT_SECONDS
          value: "180"
        - name: ACTIVATOR_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        volumeMounts:
        - name: serving-cert
          mountPath: /var/run/nodeactivator/tls
          readOnly: true
        - name: proxy-client-ca
          mountPath: /var/run/nodeactivator/proxy-ca
          readOnly: true
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: serving-cert
        projected:
          sources:
          - podCertificate:
              signerName: nodeactivator.notk8s.io/serving
              keyType: ECDSAP256
              maxExpirationSeconds: 86400
              credentialBundlePath: credential.pem
      - name: proxy-client-ca
        configMap:
          name: extension-apiserver-authentication
          items:
          - key: requestheader-client-ca-file
            path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: nodeactivator-metrics
  namespace: kube-system
spec:
  selector:
    app.kubernetes.io/name: nodeactivator
  ports:
  - name: https
    port: 443
    targetPort: metrics-https
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
spec:
  group: external.metrics.k8s.io
  version: v1beta1
  groupPriorityMinimum: 100
  versionPriority: 100
  service:
    namespace: kube-system
    name: nodeactivator-metrics
    port: 443
  # Replace this with the base64-encoded PEM CA certificate mounted into the
  # nodeactivator-cert-signer Pod from Secret/nodeactivator-signer-ca.
  caBundle: REPLACE_WITH_BASE64_SERVING_CA
