[package]
name = "nodestore"
description = "Datastore for not-k8s — the etcd v3 gRPC API over sqlite, event-driven instead of polled"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "nodestore"
path = "src/lib.rs"

[[bin]]
name = "nodestore"
path = "src/main.rs"

# No cargo features, deliberately — like nodeproxy, and unlike nodelet. There
# is no "mock datastore" worth having: the only client that matters is a real
# kube-apiserver, so the thing to test against is a real kube-apiserver.
#
# This crate DOES take tonic/prost, which nodeproxy deliberately refuses. That
# is not the boundary eroding: nodeproxy's rule is about not absorbing
# nodelet's container-runtime stack, whereas a gRPC server is this component's
# entire external interface. The boundary that matters here is the same one as
# everywhere else — nodestore depends on no other component crate.
[dependencies]
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

# bundled: compile SQLite from source rather than linking whatever the host
# happens to have. An edge device is exactly the machine most likely to have
# an old or absent libsqlite3, and this project's whole deployment story is
# "one binary, no runtime dependencies to install".
rusqlite = { version = "0.32", features = ["bundled", "blob"] }

# Raft consensus. The algorithm only — leader election, log replication,
# joint-consensus membership changes, ReadIndex — with the log storage, the
# transport and the state machine all still ours (src/raft/). This is the
# real protocol rather than a hand-rolled approximation of it: consensus bugs
# are silent, catastrophic, and only surface under exactly the partition and
# crash conditions that are hardest to test.
#
# protobuf-codec, not prost-codec, deliberately: raft-proto's prost codec
# pins prost 0.11 while this crate is on 0.14 via tonic, and encoding a raft
# message would then need both majors in scope at once. raft depends on
# rust-protobuf 2 unconditionally either way, so this costs nothing extra.
# Raft messages cross our own transport as opaque bytes (proto/peer.proto),
# so none of this reaches the wire format.
raft = { version = "0.7", default-features = false, features = ["protobuf-codec"] }
protobuf = "2"
# raft-rs logs through slog. src/raft/logging.rs bridges it into tracing so
# elections and leadership changes land in the same log as everything else —
# with default-logger disabled, since it would pull in a second logging stack.
slog = "2"

[build-dependencies]
# Declared with an explicit version rather than inherited: this one is not in
# the workspace's [workspace.dependencies] (nodelet declares its own copy the
# same way), and inheriting something that isn't there fails at manifest-parse
# time, before any code is even looked at.
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
