// Minimal vendored subset of containerd's top-level events API.
//
// Source of truth (field numbers verified against):
//   containerd/api/services/events/v1/events.proto  (service Events, SubscribeRequest)
//   containerd/api/types/event.proto                (Envelope)
//   containerd/api/events/task.proto                (task events; container_id == field 1)
//
// gRPC wire compatibility depends only on the package/service/method names and
// field numbers — not the message type names — so `Envelope` is declared inline
// here (instead of the original `containerd.types.Envelope`) and still decodes
// the bytes containerd sends. This API exists in ALL containerd versions, unlike
// the CRI `GetContainerEvents` RPC (containerd >= 1.7 only).

syntax = "proto3";

package containerd.services.events.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

service Events {
  // Subscribe streams a firehose of events. We only use this one.
  rpc Subscribe(SubscribeRequest) returns (stream Envelope);
}

message SubscribeRequest {
  repeated string filters = 1;
}

message Envelope {
  google.protobuf.Timestamp timestamp = 1;
  string namespace = 2;
  string topic = 3;
  google.protobuf.Any event = 4;
}

// Every `/tasks/*` event message starts with `string container_id = 1;`, so this
// one message decodes the container id out of any of them (extra fields ignored).
message TaskEventContainerId {
  string container_id = 1;
}
