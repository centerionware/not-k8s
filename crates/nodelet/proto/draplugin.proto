// draplugin.proto — the kubelet-side client half of the Dynamic Resource
// Allocation (DRA) plugin protocol (round 63). Originally reconstructed
// from public documentation of `k8s.io/kubelet/pkg/apis/dra/v1beta1`
// rather than vendored directly from the upstream Go module — that
// reconstruction turned out wrong on both the package name (real drivers
// implement `k8s.io.kubelet.pkg.apis.dra.v1`, not `dra.v1beta1` — DRA
// graduated past beta before this was written) and the `Device` message's
// field layout (missing `pool_name`/`device_name`/`share_id`, and
// `cdi_device_ids` at the wrong field number), confirmed live standing up
// a real DRA driver for e2e testing: every `NodePrepareResources` call
// failed outright with "unknown service dra.v1beta1.DRAPlugin" (round
// 121). This version is transcribed directly from
// k8s.io/kubelet/pkg/apis/dra/v1/api.proto (kubernetes/kubernetes
// staging), the same source a real driver's own generated stubs come
// from — verified working against kubernetes-sigs/dra-example-driver
// v0.4.0, the reference driver real Kubernetes e2e/conformance tests use
// for exactly this (the same role csi-driver-host-path plays for CSI).
//
// A DRA driver's own kubelet-plugin process runs this service's *server*
// side, listening on a Unix socket it announces via the same plugin
// registration handshake CSI drivers and device plugins already use (see
// pluginregistration.proto) with PluginInfo.type == "DRAPlugin". nodelet
// is the *client*: once a driver registers, nodelet dials its endpoint and
// calls these two RPCs around a pod's container creation/removal.

syntax = "proto3";

package k8s.io.kubelet.pkg.apis.dra.v1;

option go_package = "k8s.io/kubelet/pkg/apis/dra/v1";

service DRAPlugin {
    // NodePrepareResources prepares several ResourceClaims for use on the
    // node. If an error is returned, the response is ignored. Failures for
    // individual claims can be reported inside
    // NodePrepareResourcesResponse.
    rpc NodePrepareResources(NodePrepareResourcesRequest) returns (NodePrepareResourcesResponse) {}

    // NodeUnprepareResources is the opposite of NodePrepareResources. The
    // same error handling rules apply.
    rpc NodeUnprepareResources(NodeUnprepareResourcesRequest) returns (NodeUnprepareResourcesResponse) {}
}

// Claim identifies a single ResourceClaim to prepare/unprepare.
message Claim {
    // The ResourceClaim namespace (ResourceClaim.meta.Namespace). REQUIRED.
    string namespace = 1;
    // The UID of the ResourceClaim (ResourceClaim.meta.UUID). REQUIRED.
    string uid = 2;
    // The name of the ResourceClaim (ResourceClaim.meta.Name). REQUIRED.
    string name = 3;
}

message NodePrepareResourcesRequest {
    // The list of ResourceClaims that are to be prepared.
    repeated Claim claims = 1;
}

// Device is one device the driver prepared for a claim, and which
// request(s) within that claim it satisfies.
message Device {
    // The requests in the claim that this device is associated with.
    // Optional. If empty, the device is associated with all requests.
    repeated string request_names = 1;

    // The pool which contains the device. Required.
    string pool_name = 2;

    // The device itself. Required.
    string device_name = 3;

    // A single device instance may map to several CDI device IDs. None is
    // also valid.
    repeated string cdi_device_ids = 4;

    // The share ID of the device. Optional.
    optional string share_id = 5;
}

message NodePrepareResourceResponse {
    repeated Device devices = 1;
    // Non-empty means preparation failed for this specific claim; the
    // request as a whole may still have succeeded for other claims.
    string error = 2;
}

message NodePrepareResourcesResponse {
    // Keyed by claim UID.
    map<string, NodePrepareResourceResponse> claims = 1;
}

message NodeUnprepareResourcesRequest {
    repeated Claim claims = 1;
}

message NodeUnprepareResourceResponse {
    string error = 1;
}

message NodeUnprepareResourcesResponse {
    // Keyed by claim UID.
    map<string, NodeUnprepareResourceResponse> claims = 1;
}
