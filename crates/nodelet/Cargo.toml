[package]
name = "nodelet"
description = "A lean, event-driven Kubernetes node agent for single-device / edge use"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nodelet"
path = "src/main.rs"

[[example]]
name = "cri_smoke"
required-features = ["cri"]

[features]
default = []
# Enable the real containerd/CRI runtime (requires protoc at build time).
# Also gates the kubelet-style HTTP(S) server (server.rs: containerLogs/exec/
# attach/portForward) — it's meaningless without real containers to log/exec into.
cri = [
    "dep:tonic", "dep:prost", "dep:prost-types", "dep:tonic-prost", "dep:tonic-prost-build",
    "dep:tower", "dep:hyper-util", "dep:http", "dep:hyper", "dep:http-body-util", "dep:rcgen",
    "dep:percent-encoding", "dep:tokio-stream", "dep:tokio-rustls", "dep:zbus", "dep:x509-parser",
]

[dependencies]
tokio = { workspace = true }
kube = { workspace = true }
rustls = { workspace = true }
k8s-openapi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
libc = "0.2"
base64 = "0.22"

tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
hyper-util = { workspace = true, features = ["tokio", "server", "server-auto", "server-graceful"], optional = true }
http = { version = "1", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
http-body-util = { version = "0.1", optional = true }
rcgen = { version = "0.13", optional = true }
percent-encoding = { version = "2", optional = true }
tokio-stream = { version = "0.1", optional = true }
tokio-rustls = { version = "0.26", optional = true }
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }
x509-parser = { version = "0.16", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
http = "1"
tower = { workspace = true, features = ["util"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }

[package.metadata.cri]
# build.rs only compiles protos when the `cri` feature is active
