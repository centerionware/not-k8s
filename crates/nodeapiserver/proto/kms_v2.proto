syntax = "proto3";
package v2;
option go_package = "k8s.io/kms/apis/v2";

service KeyManagementService {
  rpc Status(StatusRequest) returns (StatusResponse) {}
  rpc Decrypt(DecryptRequest) returns (DecryptResponse) {}
  rpc Encrypt(EncryptRequest) returns (EncryptResponse) {}
}

message StatusRequest {}

message StatusResponse {
  string version = 1;
  string healthz = 2;
  string key_id = 3;
}

message DecryptRequest {
  bytes ciphertext = 1;
  string uid = 2;
  string key_id = 3;
  map<string, bytes> annotations = 4;
}

message DecryptResponse {
  bytes plaintext = 1;
}

message EncryptRequest {
  bytes plaintext = 1;
  string uid = 2;
}

message EncryptResponse {
  bytes ciphertext = 1;
  string key_id = 2;
  map<string, bytes> annotations = 3;
}

message EncryptedObject {
  bytes encrypted_data = 1;
  string key_id = 2;
  bytes encrypted_dek_source = 3;
  map<string, bytes> annotations = 4;
  EncryptedDEKSourceType encrypted_dek_source_type = 5;
}

enum EncryptedDEKSourceType {
  AES_GCM_KEY = 0;
  HKDF_SHA256_XNONCE_AES_GCM_SEED = 1;
}
